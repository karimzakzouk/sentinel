{{- if .Values.operator.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  labels:
    {{- include "sentinel.serviceLabels" (list "operator" .) | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: sentinel
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "sentinel.fullname" .) }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "sentinel.image" (list . "operator") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "sentinel.commonEnv" . | nindent 12 }}
            - name: KUBERNETES_SERVICE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - containerPort: 8080
              name: liveness
          livenessProbe:
            httpGet:
              path: /healthz
              port: liveness
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end -}}
