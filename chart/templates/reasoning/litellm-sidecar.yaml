{{- if eq .Values.mode "distributed" -}}
{{- if eq .Values.sentinel.llm.provider "litellm" -}}
# Optional LiteLLM proxy deployment.
#
# LiteLLM exposes a single OpenAI-compatible endpoint that proxies to
# Anthropic, Bedrock, Azure, Cohere, Mistral, and 100+ other providers.
# Use this when your LLM provider has no native OpenAI endpoint.
#
# Required: set SENTINEL_LLM_API_KEY (or the upstream provider key) via
# the existing secret. LiteLLM reads its config from the LITELLM_MODEL env
# var (e.g. "anthropic/claude-3-5-sonnet-20241022").
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-litellm-config
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  config.yaml: |
    model_list:
      - model_name: fast
        litellm_params:
          model: {{ .Values.sentinel.llm.fastModel | quote }}
          api_key: os.environ/UPSTREAM_API_KEY
      - model_name: frontier
        litellm_params:
          model: {{ .Values.sentinel.llm.frontierModel | quote }}
          api_key: os.environ/UPSTREAM_API_KEY
    litellm_settings:
      drop_params: true
      telemetry: false
    general_settings:
      master_key: sk-sentinel-master
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-litellm
  labels:
    {{- include "sentinel.serviceLabels" (list "litellm" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: sentinel
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.fullname" . }}-secrets
                  key: llmApiKey
            - name: LITELLM_MASTER_KEY
              value: "sk-sentinel-master"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1000m, memory: 1Gi }
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-litellm
  labels:
    {{- include "sentinel.serviceLabels" (list "litellm" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}

{{- end -}}
