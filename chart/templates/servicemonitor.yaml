{{/* v3.18.0: H32 — ServiceMonitor for Prometheus Operator.
   /metrics is already served (api/server.go), but kube-prometheus-stack
   users got zero metrics auto-discovered without this template.
   H7 fix: selector now matches the Service's actual labels (literal
   "sentinel" for app.kubernetes.io/name) instead of {{ .Release.Name }},
   which only worked if the release was named exactly "sentinel". */}}
{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    sentinel.io/managed: "true"
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval | default "30s" }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
