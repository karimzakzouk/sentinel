{{/*
Secret management — supports 3 backends:

  1. plain (default) — plain Kubernetes Secret with stringData.
     For dev only. The chart warns if used with ingress.enabled=true.

  2. sealed — Bitnami sealed-secrets. User provides a pre-encrypted
     SealedSecret manifest in sentinel.secrets.sealedYaml. The chart
     applies it as-is. Requires the sealed-secrets controller installed.

  3. external — external-secrets.io. User provides an ExternalSecret
     manifest in sentinel.secrets.externalSecretYaml that references
     Vault/AWS SM/GCP SM. Requires the external-secrets operator.

The Sentinel services always read from a Secret named
"<release>-secrets" with keys "githubToken" and "llmApiKey".
For sealed/external backends, that Secret is created by the
SealedSecret/ExternalSecret controller, not by this chart.
*/}}

{{- if eq .Values.sentinel.secrets.backend "plain" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-secrets
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    sentinel.io/warning: "plain-secret-backend — not for production use. Set sentinel.secrets.backend=sealed or external. You can also leave githubToken/llm.apiKey empty here and set them via the Settings UI."
type: Opaque
stringData:
  githubToken: {{ .Values.sentinel.githubToken | default "" | quote }}
  llmApiKey: {{ .Values.sentinel.llm.apiKey | default "" | quote }}
  dockerHubToken: {{ .Values.sentinel.dockerHubToken | default "" | quote }}
{{- else if eq .Values.sentinel.secrets.backend "sealed" -}}
{{- if .Values.sentinel.secrets.sealedYaml }}
{{ .Values.sentinel.secrets.sealedYaml }}
{{- else }}
{{ fail "sentinel.secrets.backend=sealed requires sentinel.secrets.sealedYaml to be set (a pre-encrypted SealedSecret manifest)" }}
{{- end }}
{{- else if eq .Values.sentinel.secrets.backend "external" -}}
{{- if .Values.sentinel.secrets.externalSecretYaml }}
{{ .Values.sentinel.secrets.externalSecretYaml }}
{{- else }}
{{ fail "sentinel.secrets.backend=external requires sentinel.secrets.externalSecretYaml to be set (an ExternalSecret manifest)" }}
{{- end }}
{{- else }}
{{ fail (printf "Unknown sentinel.secrets.backend: %s (must be plain, sealed, or external)" .Values.sentinel.secrets.backend) }}
{{- end }}
---
# Docker Hub credentials for Kaniko (sandbox image builder).
# Kaniko needs push access to build + push canary images for sandbox verification.
# This secret is a kubernetes.io/dockerconfigjson type with the Docker Hub token.
{{- if .Values.sentinel.dockerHubToken }}
apiVersion: v1
kind: Secret
metadata:
  name: kaniko-docker-hub-creds
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ printf "{\"auths\":{\"docker.io\":{\"username\":\"%s\",\"password\":\"%s\"}}}" .Values.sentinel.dockerHubUsername .Values.sentinel.dockerHubToken | quote }}
{{- end }}
