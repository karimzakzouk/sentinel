apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-secrets
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  githubToken: {{ .Values.sentinel.githubToken | default "" | quote }}
  llmApiKey: {{ .Values.sentinel.llm.apiKey | default "" | quote }}
