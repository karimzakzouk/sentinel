{{/* Single-pod deployment for Sentinel. One container, no sidecars. */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SENTINEL_LLM_PROVIDER
              value: {{ .Values.sentinel.llm.provider | quote }}
            - name: SENTINEL_LLM_BASE_URL
              value: {{ .Values.sentinel.llm.baseUrl | quote }}
            - name: SENTINEL_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: llmApiKey
            - name: SENTINEL_LLM_FAST_MODEL
              value: {{ .Values.sentinel.llm.fastModel | quote }}
            - name: SENTINEL_LLM_FRONTIER_MODEL
              value: {{ .Values.sentinel.llm.frontierModel | quote }}
            - name: SENTINEL_LLM_EMBEDDING_MODEL
              value: {{ .Values.sentinel.llm.embeddingModel | quote }}
            - name: SENTINEL_LLM_EMBEDDING_DIM
              value: {{ .Values.sentinel.llm.embeddingDim | default 1536 | quote }}
            {{- if .Values.sentinel.llm.embeddingProvider }}
            - name: SENTINEL_EMBEDDING_PROVIDER
              value: {{ .Values.sentinel.llm.embeddingProvider | quote }}
            {{- end }}
            {{- if .Values.sentinel.llm.embeddingApiKey }}
            - name: SENTINEL_EMBEDDING_API_KEY
              value: {{ .Values.sentinel.llm.embeddingApiKey | quote }}
            {{- end }}
            {{- if .Values.sentinel.llm.embeddingBaseUrl }}
            - name: SENTINEL_EMBEDDING_BASE_URL
              value: {{ .Values.sentinel.llm.embeddingBaseUrl | quote }}
            {{- end }}
            {{- if .Values.sentinel.llm.semanticCache }}
            - name: SENTINEL_LLM_SEMANTIC_CACHE
              value: "true"
            - name: SENTINEL_LLM_CACHE_THRESHOLD
              value: {{ .Values.sentinel.llm.semanticCacheThreshold | default 0.97 | quote }}
            {{- end }}
            {{- if .Values.sentinel.llm.providers }}
            - name: SENTINEL_LLM_PROVIDERS
              value: {{ .Values.sentinel.llm.providers | toJson | quote }}
            {{- end }}
            - name: SENTINEL_AUTO_MERGE_ENABLED
              value: {{ .Values.sentinel.autoMerge.enabled | quote }}
            {{- if .Values.sentinel.autoMerge.namespaces }}
            - name: SENTINEL_AUTO_MERGE_NAMESPACES
              value: {{ join "," .Values.sentinel.autoMerge.namespaces | quote }}
            {{- end }}
            - name: SENTINEL_AUTO_MERGE_MIN_CONFIDENCE
              value: {{ .Values.sentinel.autoMerge.minConfidence | quote }}
            - name: SENTINEL_AUTO_MERGE_REQUIRE_CI
              value: {{ .Values.sentinel.autoMerge.requireCI | quote }}
            - name: SENTINEL_AUTO_MERGE_CI_TIMEOUT_SEC
              value: {{ .Values.sentinel.autoMerge.ciTimeoutSec | quote }}
            - name: SENTINEL_AUTO_MERGE_MAX_PER_HOUR
              value: {{ .Values.sentinel.autoMerge.maxPerHour | quote }}
            - name: SENTINEL_AUTO_MERGE_COOLDOWN_MIN
              value: {{ .Values.sentinel.autoMerge.cooldownMin | quote }}
            - name: SENTINEL_AUTOMERGE_MIN_SANDBOX_LEVEL
              value: {{ .Values.sentinel.autoMerge.minSandboxLevel | default 3 | quote }}
            {{- if hasKey .Values.sentinel.autoMerge "ciRetries" }}
            - name: SENTINEL_AUTOMERGE_CI_RETRIES
              value: {{ .Values.sentinel.autoMerge.ciRetries | quote }}
            {{- end }}
            {{- if .Values.sentinel.postDeployCheck }}
            - name: SENTINEL_POSTDEPLOY_CHECK_ENABLED
              value: {{ .Values.sentinel.postDeployCheck.enabled | quote }}
            - name: SENTINEL_POSTDEPLOY_CHECK_DURATION_SEC
              value: {{ .Values.sentinel.postDeployCheck.durationSec | default 480 | quote }}
            - name: SENTINEL_POSTDEPLOY_REGRESSION_COOLDOWN
              value: {{ .Values.sentinel.postDeployCheck.regressionCooldown | default true | quote }}
            - name: SENTINEL_POSTDEPLOY_REVERT_AUTO_MERGE
              value: {{ .Values.sentinel.postDeployCheck.revertAutoMerge | default true | quote }}
            {{- end }}
            {{- if .Values.sentinel.safeActions.enabled }}
            - name: SENTINEL_SAFE_ACTIONS_ENABLED
              value: "true"
            - name: SENTINEL_SAFE_ACTIONS_NAMESPACES
              value: {{ .Values.sentinel.safeActions.namespaces | join "," | quote }}
            - name: SENTINEL_SAFE_ACTIONS_MAX_PER_HOUR
              value: {{ .Values.sentinel.safeActions.maxPerHour | quote }}
            - name: SENTINEL_SAFE_ACTIONS_MAX_SCALE_DELTA_PCT
              value: {{ .Values.sentinel.safeActions.maxScaleDeltaPct | quote }}
            {{- end }}
            {{- if .Values.sentinel.fixVerify.enabled }}
            - name: SENTINEL_FIX_VERIFY
              value: "true"
            {{- end }}
            - name: SENTINEL_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: githubToken
            - name: SENTINEL_DOCKER_HUB_USERNAME
              value: {{ .Values.sentinel.dockerHubUsername | default "" | quote }}
            - name: SENTINEL_DOCKER_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: dockerHubToken
                  optional: true
            - name: SENTINEL_KANIKO_REGISTRY
              value: {{ .Values.sentinel.kanikoRegistry | default "docker.io" | quote }}
            - name: SENTINEL_GIT_HOST
              value: {{ .Values.sentinel.gitHost | default "github.com" | quote }}
            - name: SENTINEL_GITHUB_API_URL
              value: {{ .Values.sentinel.githubApiUrl | default "https://api.github.com" | quote }}
            - name: SENTINEL_DEFAULT_BRANCH
              value: {{ .Values.sentinel.defaultBranch | default "main" | quote }}
            {{- if .Values.sentinel.highRiskServices }}
            - name: SENTINEL_HIGH_RISK_SERVICES
              value: {{ .Values.sentinel.highRiskServices | quote }}
            {{- end }}
            - name: SENTINEL_SKIP_NAMESPACES
              value: {{ .Values.sentinel.skipNamespaces | quote }}
            - name: SENTINEL_KANIKO_INIT_IMAGE
              value: {{ .Values.sentinel.kanikoInitImage | default "alpine/git:2.43.0" | quote }}
            - name: SENTINEL_KANIKO_EXECUTOR_IMAGE
              value: {{ .Values.sentinel.kanikoExecutorImage | default "gcr.io/kaniko-project/executor:v1.24.0" | quote }}
            - name: SENTINEL_MAX_CONCURRENT_INVESTIGATIONS
              value: {{ .Values.sentinel.maxConcurrentInvestigations | default 3 | quote }}
            - name: SENTINEL_MAX_FIX_SERVICES
              value: {{ .Values.sentinel.maxFixServices | default 0 | quote }}
            - name: SENTINEL_PRODUCTION_NAMESPACES
              value: {{ .Values.sentinel.productionNamespaces | quote }}
            - name: SENTINEL_WRITE_NAMESPACES
              value: {{ join "," .Values.sentinel.rbac.writeNamespaces | quote }}
            - name: SENTINEL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SENTINEL_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: PORT
              value: "8000"
            {{- if .Values.sentinel.apiToken }}
            - name: SENTINEL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: apiToken
            {{- end }}
            {{- if .Values.sentinel.allowedGithubRepos }}
            - name: SENTINEL_ALLOWED_GITHUB_REPOS
              value: {{ .Values.sentinel.allowedGithubRepos | quote }}
            {{- end }}
            {{- if .Values.sentinel.githubAppId }}
            - name: SENTINEL_GITHUB_APP_ID
              value: {{ .Values.sentinel.githubAppId | quote }}
            {{- end }}
            {{- if .Values.sentinel.githubAppPrivateKey }}
            - name: SENTINEL_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: githubAppPrivateKey
                  optional: true
            {{- end }}
            {{- if .Values.sentinel.githubAppInstallId }}
            - name: SENTINEL_GITHUB_APP_INSTALL_ID
              value: {{ .Values.sentinel.githubAppInstallId | quote }}
            {{- end }}
            {{- if .Values.sentinel.observability.prometheusUrl }}
            - name: SENTINEL_PROMETHEUS_URL
              value: {{ .Values.sentinel.observability.prometheusUrl | quote }}
            {{- end }}
            {{- if .Values.sentinel.observability.lokiUrl }}
            - name: SENTINEL_LOKI_URL
              value: {{ .Values.sentinel.observability.lokiUrl | quote }}
            {{- end }}
            {{- if .Values.sentinel.observability.jaegerUrl }}
            - name: SENTINEL_JAEGER_URL
              value: {{ .Values.sentinel.observability.jaegerUrl | quote }}
            {{- end }}
            {{- if .Values.sentinel.observability.tempoUrl }}
            - name: SENTINEL_TEMPO_URL
              value: {{ .Values.sentinel.observability.tempoUrl | quote }}
            {{- end }}
            - name: SENTINEL_LOG_LEVEL
              value: {{ .Values.sentinel.logLevel | quote }}
            - name: SENTINEL_LLM_MAX_RETRIES
              value: {{ .Values.sentinel.llmRetry.maxRetries | quote }}
            - name: SENTINEL_LLM_RETRY_BASE_DELAY_MS
              value: {{ .Values.sentinel.llmRetry.baseDelayMs | quote }}
            - name: SENTINEL_SANDBOX_PROBE_PATHS
              value: {{ .Values.sentinel.sandboxProbePaths | quote }}
            - name: SENTINEL_SANDBOX_ENABLED
              value: {{ .Values.sentinel.sandbox.enabled | default true | quote }}
            - name: SENTINEL_SANDBOX_REQUIRED
              value: {{ .Values.sentinel.sandbox.required | default false | quote }}
            - name: SENTINEL_SANDBOX_MAX_RETRIES
              value: {{ .Values.sentinel.sandbox.maxRetries | default 2 | quote }}
            - name: SENTINEL_SANDBOX_NETWORK_POLICY_REQUIRED
              value: {{ .Values.sentinel.sandbox.networkPolicyRequired | default true | quote }}
            {{- if .Values.sentinel.slackWebhook }}
            - name: SENTINEL_SLACK_WEBHOOK
              value: {{ .Values.sentinel.slackWebhook | quote }}
            {{- end }}
            {{- if .Values.sentinel.slackBot.signingSecret }}
            - name: SENTINEL_SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: slackSigningSecret
                  optional: true
            {{- end }}
            {{- if .Values.sentinel.slackBot.botUserID }}
            - name: SENTINEL_SLACK_BOT_USER_ID
              value: {{ .Values.sentinel.slackBot.botUserID | quote }}
            {{- end }}
            {{- if .Values.sentinel.slackBot.botToken }}
            - name: SENTINEL_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: slackBotToken
                  optional: true
            {{- end }}
            {{- if .Values.sentinel.githubWebhookSecret }}
            - name: SENTINEL_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: githubWebhookSecret
                  optional: true
            {{- end }}
            {{- if .Values.sentinel.tier2.attest.enabled }}
            - name: SENTINEL_ATTEST_ENABLED
              value: "true"
            - name: SENTINEL_ATTEST_LOG_DIR
              value: {{ .Values.sentinel.tier2.attest.logDir | quote }}
            {{- end }}
            {{- if .Values.sentinel.tier1.postMergeWatch.enabled }}
            - name: SENTINEL_POSTMERGE_WATCH_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.sentinel.tier1.sloWatch.enabled }}
            - name: SENTINEL_SLO_WATCH_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.sentinel.tier1.causalRCA.enabled }}
            - name: SENTINEL_CAUSAL_RCA_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.sentinel.tier1.admissionWebhook.enabled }}
            - name: SENTINEL_ADMISSION_WEBHOOK_ENABLED
              value: "true"
            - name: SENTINEL_ADMISSION_WEBHOOK_ADDR
              value: {{ .Values.sentinel.tier1.admissionWebhook.addr | quote }}
            - name: SENTINEL_ADMISSION_WEBHOOK_CERT_DIR
              value: {{ .Values.sentinel.tier1.admissionWebhook.certDir | quote }}
            {{- end }}
            {{- if .Values.sentinel.tier2.llmCostRouter.enabled }}
            - name: SENTINEL_LLMCOST_ROUTER_ENABLED
              value: "true"
            {{- end }}
            {{- if .Values.sentinel.tier2.chaos.enabled }}
            - name: SENTINEL_CHAOS_ENABLED
              value: "true"
            - name: SENTINEL_CHAOS_INTERVAL_MIN
              value: {{ .Values.sentinel.tier2.chaos.intervalMin | quote }}
            {{- if .Values.sentinel.tier2.chaos.namespaces }}
            - name: SENTINEL_CHAOS_NAMESPACES
              value: {{ join "," .Values.sentinel.tier2.chaos.namespaces | quote }}
            {{- end }}
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/name: sentinel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sentinel
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: {{ .Release.Name }}
