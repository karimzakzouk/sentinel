{{/*
Single-pod deployment for Sentinel v3. One container, no sidecars.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      # v3.18.0: M40 — 45s grace period so in-flight SQLite writes + investigation
      # cleanup (15s wait + 10s apiServer.Shutdown + ~5s buffer) can finish before
      # SIGKILL. Was: default 30s, which killed mid-commit.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SENTINEL_LLM_PROVIDER
              value: {{ .Values.sentinel.llm.provider | quote }}
            - name: SENTINEL_LLM_BASE_URL
              value: {{ .Values.sentinel.llm.baseUrl | quote }}
            - name: SENTINEL_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: llmApiKey
            - name: SENTINEL_LLM_FAST_MODEL
              value: {{ .Values.sentinel.llm.fastModel | quote }}
            - name: SENTINEL_LLM_FRONTIER_MODEL
              value: {{ .Values.sentinel.llm.frontierModel | quote }}
            # v3.4.0: configurable embedding model
            # v3.11.0: default is now "" (empty) — hash fallback by default (audit #13)
            - name: SENTINEL_LLM_EMBEDDING_MODEL
              value: {{ .Values.sentinel.llm.embeddingModel | quote }}
            # v3.11.0: Embedding dim for hash fallback (audit #13)
            - name: SENTINEL_LLM_EMBEDDING_DIM
              value: {{ .Values.sentinel.llm.embeddingDim | default 1536 | quote }}
            # v4.0.0: Multi-provider failover pool (JSON array of ProviderConfig).
            # Empty = single-provider mode (uses SENTINEL_LLM_PROVIDER + SENTINEL_LLM_API_KEY).
            {{- if .Values.sentinel.llm.providers }}
            - name: SENTINEL_LLM_PROVIDERS
              value: {{ .Values.sentinel.llm.providers | toJson | quote }}
            {{- end }}
            # v4.0.0: Auto-merge configuration
            - name: SENTINEL_AUTO_MERGE_ENABLED
              value: {{ .Values.sentinel.autoMerge.enabled | quote }}
            {{- if .Values.sentinel.autoMerge.namespaces }}
            - name: SENTINEL_AUTO_MERGE_NAMESPACES
              value: {{ join "," .Values.sentinel.autoMerge.namespaces | quote }}
            {{- end }}
            - name: SENTINEL_AUTO_MERGE_MIN_CONFIDENCE
              value: {{ .Values.sentinel.autoMerge.minConfidence | quote }}
            - name: SENTINEL_AUTO_MERGE_REQUIRE_CI
              value: {{ .Values.sentinel.autoMerge.requireCI | quote }}
            - name: SENTINEL_AUTO_MERGE_CI_TIMEOUT_SEC
              value: {{ .Values.sentinel.autoMerge.ciTimeoutSec | quote }}
            - name: SENTINEL_AUTO_MERGE_MAX_PER_HOUR
              value: {{ .Values.sentinel.autoMerge.maxPerHour | quote }}
            - name: SENTINEL_AUTO_MERGE_COOLDOWN_MIN
              value: {{ .Values.sentinel.autoMerge.cooldownMin | quote }}
            - name: SENTINEL_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: githubToken
            - name: SENTINEL_DOCKER_HUB_USERNAME
              value: {{ .Values.sentinel.dockerHubUsername | default "" | quote }}
            - name: SENTINEL_DOCKER_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: dockerHubToken
                  optional: true
            # v3.11.0: Registry-aware Kaniko (CRITICAL audit #7)
            - name: SENTINEL_KANIKO_REGISTRY
              value: {{ .Values.sentinel.kanikoRegistry | default "docker.io" | quote }}
            # v3.11.0: GitHub Enterprise / GitLab / Bitbucket (CRITICAL audit #2)
            - name: SENTINEL_GIT_HOST
              value: {{ .Values.sentinel.gitHost | default "github.com" | quote }}
            - name: SENTINEL_GITHUB_API_URL
              value: {{ .Values.sentinel.githubApiUrl | default "https://api.github.com" | quote }}
            # v3.11.0: Default branch (CRITICAL audit #6)
            - name: SENTINEL_DEFAULT_BRANCH
              value: {{ .Values.sentinel.defaultBranch | default "main" | quote }}
            # v3.11.0: Configurable high-risk services (audit obs-1)
            {{- if .Values.sentinel.highRiskServices }}
            - name: SENTINEL_HIGH_RISK_SERVICES
              value: {{ .Values.sentinel.highRiskServices | quote }}
            {{- end }}
            # v3.11.0: Configurable namespace skip list (audit #11)
            - name: SENTINEL_SKIP_NAMESPACES
              value: {{ .Values.sentinel.skipNamespaces | quote }}
            # v3.11.0: Configurable Kaniko images (audit #14)
            - name: SENTINEL_KANIKO_INIT_IMAGE
              value: {{ .Values.sentinel.kanikoInitImage | default "alpine/git:2.43.0" | quote }}
            - name: SENTINEL_KANIKO_EXECUTOR_IMAGE
              value: {{ .Values.sentinel.kanikoExecutorImage | default "gcr.io/kaniko-project/executor:v1.24.0" | quote }}
            # v3.11.0: Max concurrent investigations (audit #15)
            - name: SENTINEL_MAX_CONCURRENT_INVESTIGATIONS
              value: {{ .Values.sentinel.maxConcurrentInvestigations | default 3 | quote }}
            - name: SENTINEL_PRODUCTION_NAMESPACES
              value: {{ .Values.sentinel.productionNamespaces | quote }}
            - name: SENTINEL_WRITE_NAMESPACES
              value: {{ join "," .Values.sentinel.rbac.writeNamespaces | quote }}
            - name: SENTINEL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SENTINEL_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: PORT
              value: "8000"
            # v3.8.5: Admin API bearer token (was missing in v3.8.4 — the
            # value was in values.yaml but never passed to the pod).
            {{- if .Values.sentinel.apiToken }}
            - name: SENTINEL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: apiToken
            {{- end }}
            # v3.8.5: GitHub repo allowlist (was missing in v3.8.4).
            {{- if .Values.sentinel.allowedGithubRepos }}
            - name: SENTINEL_ALLOWED_GITHUB_REPOS
              value: {{ .Values.sentinel.allowedGithubRepos | quote }}
            {{- end }}
            # v4.0.0: GitHub App credentials — when set, PRs + comments appear
            # as "Sentinel[bot]" instead of the PAT owner. All three required.
            {{- if .Values.sentinel.githubAppId }}
            - name: SENTINEL_GITHUB_APP_ID
              value: {{ .Values.sentinel.githubAppId | quote }}
            {{- end }}
            {{- if .Values.sentinel.githubAppPrivateKey }}
            - name: SENTINEL_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: githubAppPrivateKey
                  optional: true
            {{- end }}
            {{- if .Values.sentinel.githubAppInstallId }}
            - name: SENTINEL_GITHUB_APP_INSTALL_ID
              value: {{ .Values.sentinel.githubAppInstallId | quote }}
            {{- end }}
            # v3.4.0: Observability backends (for Evidence Gatherer)
            {{- if .Values.sentinel.observability.prometheusUrl }}
            - name: SENTINEL_PROMETHEUS_URL
              value: {{ .Values.sentinel.observability.prometheusUrl | quote }}
            {{- end }}
            {{- if .Values.sentinel.observability.lokiUrl }}
            - name: SENTINEL_LOKI_URL
              value: {{ .Values.sentinel.observability.lokiUrl | quote }}
            {{- end }}
            {{- if .Values.sentinel.observability.jaegerUrl }}
            - name: SENTINEL_JAEGER_URL
              value: {{ .Values.sentinel.observability.jaegerUrl | quote }}
            {{- end }}
            # v3.4.0: Structured logging level
            - name: SENTINEL_LOG_LEVEL
              value: {{ .Values.sentinel.logLevel | quote }}
            # v3.4.0: LLM retry config
            - name: SENTINEL_LLM_MAX_RETRIES
              value: {{ .Values.sentinel.llmRetry.maxRetries | quote }}
            - name: SENTINEL_LLM_RETRY_BASE_DELAY_MS
              value: {{ .Values.sentinel.llmRetry.baseDelayMs | quote }}
            # v3.4.0: Sandbox probe paths
            - name: SENTINEL_SANDBOX_PROBE_PATHS
              value: {{ .Values.sentinel.sandboxProbePaths | quote }}
            # v3.14.0: Sandbox configuration
            - name: SENTINEL_SANDBOX_ENABLED
              value: {{ .Values.sentinel.sandbox.enabled | default true | quote }}
            - name: SENTINEL_SANDBOX_REQUIRED
              value: {{ .Values.sentinel.sandbox.required | default false | quote }}
            - name: SENTINEL_SANDBOX_MAX_RETRIES
              value: {{ .Values.sentinel.sandbox.maxRetries | default 2 | quote }}
            # v3.4.0: Slack webhook (optional)
            {{- if .Values.sentinel.slackWebhook }}
            - name: SENTINEL_SLACK_WEBHOOK
              value: {{ .Values.sentinel.slackWebhook | quote }}
            {{- end }}
            # v3.5.0: Interactive Slack bot (Events API + slash commands)
            {{- if .Values.sentinel.slackBot.signingSecret }}
            - name: SENTINEL_SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: slackSigningSecret
                  optional: true
            {{- end }}
            {{- if .Values.sentinel.slackBot.botUserID }}
            - name: SENTINEL_SLACK_BOT_USER_ID
              value: {{ .Values.sentinel.slackBot.botUserID | quote }}
            {{- end }}
            {{- if .Values.sentinel.slackBot.botToken }}
            - name: SENTINEL_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: slackBotToken
                  optional: true
            {{- end }}
            # v3.5.0: Predictive PR review (GitHub webhook)
            {{- if .Values.sentinel.githubWebhookSecret }}
            - name: SENTINEL_GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: githubWebhookSecret
                  optional: true
            {{- end }}
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            # v3.11.0: /tmp emptyDir — readOnlyRootFilesystem:true makes the
            # rootfs read-only. Without this mount, any feature that writes
            # to /tmp (os.CreateTemp, http cache, etc.) silently fails. The
            # syntax validators were the original victim — they wrote to
            # /tmp via os.CreateTemp and the failure was swallowed with
            # `return nil`, so broken code flowed through to GitHub PRs.
            # Now the validators are pure-Go (no /tmp writes), but we mount
            # /tmp anyway as defense-in-depth for future features.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        # v3.11.0: Writable /tmp for the read-only-rootfs pod.
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/name: sentinel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sentinel
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: {{ .Release.Name }}
