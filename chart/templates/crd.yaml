{{/* SentinelIncident CRD — the manual trigger mechanism */}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sentinelincidents.sentinel.io
spec:
  group: sentinel.io
  names:
    plural: sentinelincidents
    singular: sentinelincident
    kind: SentinelIncident
    shortNames: ["si", "incident"]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              # M3 — `service` is required. Was: empty spec accepted,
              # triggering an investigation against "unknown" service.
              required: ["service"]
              properties:
                service:
                  type: string
                  minLength: 1
                namespace:
                  type: string
                reason:
                  type: string
                trigger:
                  type: string
                  enum: [manual, crd_watcher, alertmanager]
                repo:
                  type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
              properties:
                phase:
                  type: string
                incidentId:
                  type: string
                rootCause:
                  type: string
                confidence:
                  type: number
                prUrl:
                  type: string
                lastUpdated:
                  type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.service
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Confidence
          type: number
          jsonPath: .status.confidence
        - name: PR
          type: string
          jsonPath: .status.prUrl
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
