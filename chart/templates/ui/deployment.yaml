{{- if .Values.ui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "sentinel.serviceLabels" (list "ui" .) | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: sentinel
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ui
          image: {{ include "sentinel.image" (list . "ui") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              {{- if eq .Values.mode "core" }}
              value: {{ printf "http://%s-core:8000" .Release.Name | quote }}
              {{- else }}
              value: {{ printf "http://%s-reasoning:8000" .Release.Name | quote }}
              {{- end }}
            - name: API_BASE_URL
              {{- if eq .Values.mode "core" }}
              value: {{ printf "http://%s-core:8000" .Release.Name | quote }}
              {{- else }}
              value: {{ printf "http://%s-reasoning:8000" .Release.Name | quote }}
              {{- end }}
            - name: AUTH_TRUST_HOST
              value: "true"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: SENTINEL_UI_AUTH_MODE
              value: {{ .Values.ui.auth.mode | quote }}
            - name: SENTINEL_UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.fullname" . }}-ui-secrets
                  key: password
                  optional: true
            - name: NEXTAUTH_URL
              value: {{ printf "http://%s-ui:80" .Release.Name | quote }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.fullname" . }}-ui-secrets
                  key: nextauthSecret
                  optional: true
            {{- if eq .Values.ui.auth.mode "github" }}
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.ui.auth.githubClientId | quote }}
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.fullname" . }}-ui-secrets
                  key: githubClientSecret
            - name: SENTINEL_UI_AUTH_ORG
              value: {{ .Values.ui.auth.githubOrg | quote }}
            {{- end }}
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui
  labels:
    {{- include "sentinel.serviceLabels" (list "ui" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: ui
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}
