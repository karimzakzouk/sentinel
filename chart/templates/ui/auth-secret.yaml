{{- if .Values.ui.enabled -}}
{{- if eq .Values.ui.auth.mode "disabled" -}}
{{- if .Values.ingress.enabled -}}
{{ fail "sentinel.ui.auth.mode=disabled is not allowed when ingress.enabled=true. Set ui.auth.mode=credentials or github to expose the UI to the internet." }}
{{- end }}
{{- end }}

{{- if or (eq .Values.ui.auth.mode "credentials") (eq .Values.ui.auth.mode "github") }}
{{- $uiPassword := include "sentinel.uiPassword" . -}}
{{- $nextauthSecret := include "sentinel.nextauthSecret" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-ui-secrets
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.ui.auth.mode "credentials" }}
  password: {{ $uiPassword | quote }}
  {{- end }}
  {{- if eq .Values.ui.auth.mode "github" }}
  githubClientSecret: {{ .Values.ui.auth.githubClientSecret | required "ui.auth.githubClientSecret is required when ui.auth.mode=github" | quote }}
  {{- end }}
  # NextAuth secret — used to sign JWT session cookies. Auto-generated in v2.0.0.
  nextauthSecret: {{ $nextauthSecret | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sentinel.fullname" . }}-ui-auth
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  authMode: {{ .Values.ui.auth.mode | quote }}
  {{- if eq .Values.ui.auth.mode "credentials" }}
  # Print this to helm install output (see templates/_helpers.tpl sentinel.uiPassword)
  autoGeneratedPassword: {{ $uiPassword | quote }}
  {{- end }}
{{- end }}
{{- end }}
