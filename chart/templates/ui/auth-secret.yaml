{{- if .Values.ui.enabled -}}
{{- if eq .Values.ui.auth.mode "disabled" -}}
{{- if .Values.ingress.enabled -}}
{{ fail "sentinel.ui.auth.mode=disabled is not allowed when ingress.enabled=true. Set ui.auth.mode=credentials or github to expose the UI to the internet." }}
{{- end }}
{{- end }}

{{- if or (eq .Values.ui.auth.mode "credentials") (eq .Values.ui.auth.mode "github") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}-ui-secrets
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.ui.auth.mode "credentials" }}
  password: {{ .Values.ui.auth.password | required "ui.auth.password is required when ui.auth.mode=credentials" | quote }}
  {{- end }}
  {{- if eq .Values.ui.auth.mode "github" }}
  githubClientSecret: {{ .Values.ui.auth.githubClientSecret | required "ui.auth.githubClientSecret is required when ui.auth.mode=github" | quote }}
  {{- end }}
  # NextAuth secret — used to sign JWT session cookies. Generate with:
  #   openssl rand -base64 32
  nextauthSecret: {{ .Values.ui.auth.nextauthSecret | required "ui.auth.nextauthSecret is required when auth is enabled. Generate with: openssl rand -base64 32" | quote }}
{{- end }}
{{- end }}
