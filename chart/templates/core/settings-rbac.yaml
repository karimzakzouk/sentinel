{{/*
Settings manager Role + RoleBinding — lets Sentinel read/write ConfigMaps +
Secrets in its own namespace (for runtime settings persistence via the
SettingsStore).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sentinel.fullname" . }}-settings-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sentinel.fullname" . }}-settings-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sentinel.fullname" . }}-settings-manager
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (include "sentinel.fullname" .) }}
    namespace: {{ .Release.Namespace }}
