{{- if eq .Values.mode "core" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-core
  labels:
    {{- include "sentinel.serviceLabels" (list "core" .) | nindent 4 }}
spec:
  replicas: {{ .Values.core.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: core
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: sentinel
      annotations:
        checksum/config: {{ include "sentinel.commonEnv" . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "sentinel.fullname" .) }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: core
          image: {{ include "sentinel.image" (list . "core") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "sentinel.commonEnv" . | nindent 12 }}
            - name: PORT
              value: "8000"
            - name: PROMETHEUS_URL
              value: {{ .Values.ingestion.env.prometheusUrl | default "" | quote }}
            - name: LOKI_URL
              value: {{ .Values.ingestion.env.lokiUrl | default "" | quote }}
            - name: JAEGER_URL
              value: {{ .Values.ingestion.env.jaegerUrl | default "" | quote }}
            - name: SENTINEL_INVESTIGATION_TIMEOUT
              value: "300"
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
        # OPA sidecar — runs the governance policies
        - name: opa
          image: {{ printf "%s:%s" .Values.opa.image .Values.opa.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
          ports:
            - containerPort: 8181
              name: opa
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          resources:
            {{- toYaml .Values.opa.resources | nindent 12 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policies
          configMap:
            name: {{ .Release.Name }}-opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-core
  labels:
    {{- include "sentinel.serviceLabels" (list "core" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: core
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}
