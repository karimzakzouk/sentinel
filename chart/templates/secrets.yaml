{{/* Secrets — GitHub token + LLM API key + Docker Hub token + Slack + Webhook */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  githubToken: {{ .Values.sentinel.githubToken | default "" | quote }}
  llmApiKey: {{ .Values.sentinel.llm.apiKey | default "" | quote }}
  dockerHubToken: {{ .Values.sentinel.dockerHubToken | default "" | quote }}
  # v3.5.0: Interactive Slack bot + predictive PR review
  slackSigningSecret: {{ .Values.sentinel.slackBot.signingSecret | default "" | quote }}
  slackBotToken: {{ .Values.sentinel.slackBot.botToken | default "" | quote }}
  githubWebhookSecret: {{ .Values.sentinel.githubWebhookSecret | default "" | quote }}
  # v3.8.5: Admin API bearer token
  apiToken: {{ .Values.sentinel.apiToken | default "" | quote }}
---
{{/* Docker Hub credentials for Kaniko (sandbox image builder)
     v3.11.0: Registry is now configurable via sentinel.kanikoRegistry
     (CRITICAL audit #7). Was hardcoded to https://index.docker.io/v1/,
     which broke ECR/GCR/ACR/Harbor/Quay users — the dockerconfigjson
     auth was for docker.io even when the destination was a different
     registry, so Kaniko's push would fail with "unauthorized".

     The default sentinel.kanikoRegistry is "docker.io", which maps to
     the canonical Docker Hub auth URL "https://index.docker.io/v1/".
     For other registries, the auth URL is "https://<registry>" (or
     "https://<registry>/v1" for self-hosted Docker v2 registries that
     need the v1 compat path — rare).

     We use a simple heuristic:
       - "docker.io" → "https://index.docker.io/v1/"
       - anything else → "https://<registry>/v1/" if it has no scheme,
         or the registry string as-is if it already has a scheme.
*/}}
{{- if .Values.sentinel.dockerHubToken }}
apiVersion: v1
kind: Secret
metadata:
  name: kaniko-docker-hub-creds
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
stringData:
  {{- $registry := .Values.sentinel.kanikoRegistry | default "docker.io" }}
  {{- $authURL := "https://index.docker.io/v1/" }}
  {{- if ne $registry "docker.io" }}
    {{- if hasPrefix "https://" $registry }}
      {{- $authURL = (printf "%s/v1/" (trimSuffix "/" $registry)) }}
    {{- else }}
      {{- $authURL = (printf "https://%s/v1/" (trimSuffix "/" $registry)) }}
    {{- end }}
  {{- end }}
  .dockerconfigjson: {{ dict "auths" (dict $authURL (dict "username" .Values.sentinel.dockerHubUsername "password" .Values.sentinel.dockerHubToken)) | toJson | quote }}
{{- end }}
