{{- if .Values.postgres.backup.enabled -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-postgres-backup
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              env:
                - name: PGPASSWORD
                  value: {{ .Values.postgres.auth.password | quote }}
                - name: AWS_ACCESS_KEY_ID
                  value: {{ .Values.postgres.backup.awsAccessKeyId | quote }}
                - name: AWS_SECRET_ACCESS_KEY
                  value: {{ .Values.postgres.backup.awsSecretAccessKey | quote }}
                - name: S3_BUCKET
                  value: {{ .Values.postgres.backup.s3Bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.postgres.backup.s3Prefix | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  FILENAME="sentinel-${TIMESTAMP}.sql.gz"
                  echo "Backing up to s3://${S3_BUCKET}/${S3_PREFIX}/${FILENAME}"
                  pg_dump -h {{ .Release.Name }}-postgresql \
                    -U {{ .Values.postgres.auth.username }} \
                    -d {{ .Values.postgres.auth.database }} | gzip > /tmp/${FILENAME}
                  aws s3 cp /tmp/${FILENAME} s3://${S3_BUCKET}/${S3_PREFIX}/${FILENAME} \
                    --endpoint-url ${AWS_ENDPOINT:-}
                  echo "Backup complete: ${FILENAME}"
                  # Clean up backups older than 30 days
                  aws s3 ls s3://${S3_BUCKET}/${S3_PREFIX}/ | \
                    awk '{print $4}' | \
                    while read f; do
                      FILE_DATE=$(echo $f | grep -oP '\d{8}-\d{6}')
                      if [ -n "$FILE_DATE" ]; then
                        CUTOFF=$(date -d '30 days ago' +%Y%m%d)
                        FILE_DAY=$(echo $FILE_DATE | cut -c1-8)
                        if [ "$FILE_DAY" -lt "$CUTOFF" ]; then
                          aws s3 rm s3://${S3_BUCKET}/${S3_PREFIX}/$f
                          echo "Deleted old backup: $f"
                        fi
                      fi
                    done
{{- end }}
