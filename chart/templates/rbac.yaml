{{/* RBAC: ServiceAccount + ClusterRole (read) + per-namespace Role (write). */}}
{{/*
Least-privilege design:
  - ClusterRole (read-only): pods, pods/log, services, configmaps, events,
    namespaces, nodes, deployments, statefulsets, daemonsets, replicasets,
    sentinelincidents. NO secrets by default.
  - Secrets read is opt-in via sentinel.rbac.readSecrets (default false).
    The sandbox runner needs to read prod secrets to copy them into the
    sandbox namespace — operators who want this must explicitly enable it.
  - Secrets CREATE (sandbox block, gated on sandbox.enabled): the copy
    itself lands as a new Secret in the sandbox namespace. Without the
    create verb the canary pod's secretRefs dangle →
    CreateContainerConfigError → Level 1 never goes Ready (run #22:
    10/10 sandbox attempts died this way while Kaniko builds succeeded).
    Threat-model note: create-secrets adds nothing an attacker doesn't
    already have via create-deployments — a Deployment in any namespace
    can envFrom-mount any existing secret there; the kubelet projects
    the values without the caller needing read RBAC.
  - Per-namespace Role + RoleBinding for each namespace in
    sentinel.rbac.writeNamespaces: create/update/patch/delete on
    deployments, statefulsets, pods, configmaps, services.
  - Namespace creation is cluster-wide (sandbox namespaces are dynamic).
    Gated behind sandbox.enabled — disable the sandbox to remove this.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default .Release.Name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}
  labels:
    sentinel.io/managed: "true"
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "events", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.sentinel.sandbox.enabled }}
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete"]
  {{- end }}
  {{- if .Values.sentinel.rbac.readSecrets }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  - apiGroups: ["sentinel.io"]
    resources: ["sentinelincidents"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["sentinel.io"]
    resources: ["sentinelincidents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
  labels:
    sentinel.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default .Release.Name }}
    namespace: {{ .Release.Namespace }}
{{- end }}

{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kaniko
  namespace: {{ .Release.Namespace }}
  labels:
    sentinel.io/managed: "true"
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "pods/log", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kaniko
  namespace: {{ .Release.Namespace }}
  labels:
    sentinel.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-kaniko
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default .Release.Name }}
    namespace: {{ .Release.Namespace }}

{{- range $ns := $.Values.sentinel.rbac.writeNamespaces }}
{{- /* NOTE: deliberately NO Namespace object here.
     1. Write namespaces are pre-existing by definition — you grant
        Sentinel write access to namespaces you already run apps in.
        Rendering kind: Namespace makes helm refuse to install whenever
        the namespace exists without helm ownership labels (the marketly
        eval hit exactly this), and worse, an uninstall would try to
        DELETE the namespace and everything in it.
     2. If the namespace does not exist, the Role below fails with a
        clear "namespace not found" — create it first. */}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-write
  namespace: {{ $ns }}
  labels:
    sentinel.io/managed: "true"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sentinel.io"]
    resources: ["sentinelincidents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["sentinel.io"]
    resources: ["sentinelincidents/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-write
  namespace: {{ $ns }}
  labels:
    sentinel.io/managed: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-write
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.serviceAccount.name | default $.Release.Name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
