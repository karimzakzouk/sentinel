{{- if .Values.opa.enabled -}}
# ConfigMap with all the Rego policies — mounted into the OPA container
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opa-policies
  labels:
    {{- include "sentinel.serviceLabels" (list "opa" .) | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "policies/*.rego" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-opa
  labels:
    {{- include "sentinel.serviceLabels" (list "opa" .) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opa
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: sentinel
    spec:
      containers:
        - name: opa
          image: {{ printf "%s:%s" .Values.opa.image .Values.opa.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "/policies"
          ports:
            - containerPort: 8181
              name: http
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          resources:
            {{- toYaml .Values.opa.resources | nindent 12 }}
      volumes:
        - name: policies
          configMap:
            name: {{ .Release.Name }}-opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-opa
  labels:
    {{- include "sentinel.serviceLabels" (list "opa" .) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8181
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: opa
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end -}}
