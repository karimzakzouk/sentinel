# ConfigMap with all the Rego policies — always created.
# Mounted into:
#   - the OPA sidecar container in the core pod (mode=core)
#   - the OPA Deployment in distributed mode
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opa-policies
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "policies/*.rego" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
