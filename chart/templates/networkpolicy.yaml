{{- if .Values.networkPolicy.enabled -}}
# Deny-by-default NetworkPolicy for the Sentinel namespace.
# Only allows:
#   - Ingress from within the Sentinel namespace
#   - Egress to: K8s API, DNS, GitHub API, LLM API, configured observability,
#     S3 (for backups), and the Sentinel namespace itself
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sentinel.fullname" . }}-deny-by-default
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: sentinel
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from within the same namespace
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sentinel
    # Allow from the ingress controller (for the UI)
    {{- if .Values.ingress.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    {{- end }}
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # K8s API server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # GitHub API (443)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # LLM API (443) — same as above, covered by the 443 rule
    # Within-namespace communication (Kafka, Postgres, Weaviate, OPA, etc.)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: sentinel
{{- end }}
