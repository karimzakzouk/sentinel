# Sentinel v3 — Helm Chart Values
#
# v3 is a single Go binary in a single pod. No Postgres, no Weaviate, no UI,
# no OPA sidecar. ~20MB image, ~50MB RAM at idle.
#
# Install:
#   helm install sentinel sentinel/sentinel --version 3.5.0 -n sentinel --create-namespace \
#     --set sentinel.githubToken=YOUR_GITHUB_TOKEN \
#     --set sentinel.llm.apiKey=YOUR_LLM_API_KEY

image:
  registry: "docker.io/karimzakzouk"
  repository: "sentinel-v3"
  tag: "3.7.1"
  pullPolicy: Always

sentinel:
  # GitHub token — REQUIRED for code_fix / roll_forward (opens PRs)
  githubToken: ""

  # LLM settings — any OpenAI-compatible endpoint
  llm:
    provider: "zai"           # openai, zai, gemini, ollama, vllm, litellm, custom
    baseUrl: ""               # if empty, derived from provider
    apiKey: ""
    fastModel: "glm-4-flash"
    frontierModel: "glm-4.5"
    embeddingModel: "text-embedding-3-small"  # v3.4.0: configurable embedding model

  # Docker Hub creds for Kaniko sandbox image builder
  dockerHubUsername: ""
  dockerHubToken: ""

  # RBAC — namespaces where Sentinel can WRITE (apply fixes)
  rbac:
    writeNamespaces: []
    # writeNamespaces:
    #   - sim
    #   - staging

  # Namespaces treated as production (stricter governance)
  productionNamespaces: "prod,production,payments"

  # Confidence thresholds
  confidenceThresholdAutonomous: 0.92
  confidenceThresholdHumanReview: 0.70

  # Panic button thresholds
  panicCpuThresholdPct: 95.0
  panicConnectionsThreshold: 9000

  # v3.4.0: Observability backends (for Evidence Gatherer)
  observability:
    prometheusUrl: ""   # e.g. http://prometheus-server.monitoring.svc.cluster.local:9090
    lokiUrl: ""
    jaegerUrl: ""

  # v3.4.0: Structured logging level (DEBUG/INFO/WARN/ERROR)
  logLevel: "INFO"

  # v3.4.0: LLM retry config (free-tier rate-limit resilience)
  llmRetry:
    maxRetries: 3
    baseDelayMs: 500

  # v3.4.0: Sandbox probe paths (was hardcoded /pay?amount=... for demo app)
  sandboxProbePaths: "/,/healthz,/readyz"

  # v3.4.0: Slack webhook (optional, graceful degradation if empty)
  slackWebhook: ""

  # v3.5.0: Interactive Slack bot (two-way commands via Events API)
  slackBot:
    signingSecret: ""  # verifies Slack webhook signatures
    botUserID: ""      # Sentinel's Slack user ID (for @mention parsing)
    botToken: ""       # OAuth bot token (xoxb-...) for posting replies

  # v3.5.0: Predictive PR review (GitHub webhook receiver)
  githubWebhookSecret: ""  # HMAC secret for verifying GitHub webhook signatures

# Resource limits — v3 is much smaller than v2
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Storage for SQLite (incident store + vector memory)
storage:
  size: 5Gi

# Service account + RBAC
serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  # v3 needs cluster-wide read on pods/deployments/events + write on
  # SentinelIncident CRs (can be created in any namespace)
  clusterScope: true

# NetworkPolicy — deny by default, allow only needed egress.
# OFF by default in v3.0.1+ — k3s dev clusters often have CNI quirks that
# break egress to the K8s API (10.43.0.1:443). Enable for production.
networkPolicy:
  enabled: false

# Ingress (optional)
ingress:
  enabled: false
  className: nginx
  hosts:
    - host: sentinel.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
