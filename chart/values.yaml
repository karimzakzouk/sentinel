# Sentinel — Helm Chart Values
#
# Default values are tuned for a small production cluster (3+ nodes).
# Override with --set or -f values-prod.yaml.

# Global image registry — defaults to GitHub Container Registry (GHCR)
# where Sentinel's images are auto-published by CI/CD. Override only if
# you've built and pushed to your own registry.
image:
  registry: "ghcr.io/karimzakzoukz"
  pullPolicy: IfNotPresent
  pullSecrets: []

# All Sentinel services share these settings
sentinel:
  # The GitHub token Sentinel uses to clone repos, open PRs, and pull CD
  # history. REQUIRED for code_fix / roll_forward actions.
  githubToken: ""

  # --- Secret backend ---
  # plain    — plain K8s Secret (dev only, NOT for production)
  # sealed   — Bitnami sealed-secrets (user provides encrypted SealedSecret YAML)
  # external — external-secrets.io (user provides ExternalSecret YAML for Vault/AWS SM/GCP SM)
  secrets:
    backend: "plain"
    # For backend=sealed: paste your SealedSecret manifest here (encrypted with kubeseal)
    sealedYaml: ""
    # For backend=external: paste your ExternalSecret manifest here
    externalSecretYaml: ""

  # Comma-separated list of namespaces Sentinel treats as production.
  productionNamespaces: "prod,production,payments"

  # RBAC — namespaces where Sentinel is allowed to WRITE (apply fixes).
  # Empty = read-only mode (Sentinel detects + investigates but never fixes).
  # Add namespaces here to enable autonomous remediation.
  rbac:
    writeNamespaces: []
    # writeNamespaces:
    #   - prod
    #   - staging
  # Confidence thresholds for autonomous execution
  confidenceThresholdAutonomous: 0.92
  confidenceThresholdHumanReview: 0.70
  # Panic-button thresholds (Layer 6 edge case #6)
  panicCpuThresholdPct: 95.0
  panicConnectionsThreshold: 9000
  # LLM settings — Sentinel uses the OpenAI Python SDK with AsyncOpenAI(base_url=...),
  # so ANY OpenAI-compatible endpoint works.
  #
  # Pick a provider by setting `provider`. Sentinel will auto-configure the
  # correct base URL. Supported:
  #   - openai     (https://api.openai.com/v1)
  #   - zai        (https://api.z.ai/api/paas/v4) — DEFAULT
  #   - gemini     (https://generativelanguage.googleapis.com/v1beta/openai)
  #   - ollama     (http://ollama:11434/v1)
  #   - vllm       (http://vllm:8000/v1)
  #   - litellm    (http://litellm:4000/v1) — use this for Anthropic, Bedrock,
  #                 or any non-OpenAI provider (LiteLLM proxies the call)
  #   - azure      (set baseUrl explicitly to https://<resource>.openai.azure.com)
  #   - custom     (set baseUrl explicitly)
  #
  # For Anthropic: Anthropic has NO native OpenAI-compatible endpoint.
  # Run LiteLLM as a sidecar or separate service:
  #   docker run -p 4000:4000 -e ANTHROPIC_API_KEY=sk-ant-xxx \
  #     ghcr.io/berriai/litellm:main-latest --model claude-3-5-sonnet-20241022
  # Then set provider=litellm and fastModel/frontierModel to the LiteLLM model names.
  llm:
    provider: "zai"
    baseUrl: ""        # if empty, derived from provider
    apiKey: ""
    fastModel: "glm-4-flash"
    frontierModel: "glm-4.5"
  # Slack webhook for governance approvals + terraform plan notifications
  approvalWebhookUrl: ""
  tfSlackWebhook: ""

# Per-service configuration
ingestion:
  enabled: true
  image: sentinel/ingestion
  tag: "1.0.5"
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  env:
    prometheusUrl: ""    # e.g. http://prometheus-server.monitoring.svc
    lokiUrl: ""
    jaegerUrl: ""

detection:
  enabled: true
  image: sentinel/detection
  tag: "1.0.5"
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 1000m, memory: 1Gi }

reasoning:
  enabled: true
  image: sentinel/reasoning
  tag: "1.0.5"
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: 2000m, memory: 2Gi }

safety:
  enabled: true
  image: sentinel/safety
  tag: "1.0.5"
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

execution:
  enabled: true
  image: sentinel/execution
  tag: "1.0.5"
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

feedback:
  enabled: true
  image: sentinel/feedback
  tag: "1.0.5"
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

operator:
  enabled: true
  image: sentinel/operator
  tag: "1.0.5"
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }

ui:
  enabled: true
  image: sentinel/ui
  tag: "1.0.5"
  replicas: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

# OPA sidecar — runs the governance policies
opa:
  enabled: true
  image: openpolicyagent/opa
  tag: "1.0.0-static"
  port: 8181
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

# Infrastructure dependencies (toggle off if you bring your own)
postgres:
  enabled: true
  auth:
    username: sentinel
    password: sentinel
    database: sentinel
  primary:
    persistence:
      size: 10Gi

kafka:
  enabled: true
  # Strimzi Kafka operator must be installed. The chart declares it as a
  # Helm dependency; if you already have it, set this to false and provide
  # your own Kafka bootstrap servers below.
  bootstrapServers: "sentinel-kafka-bootstrap:9092"
  topicPrefix: "sentinel"
  replicas: 3
  schemaRegistry:
    enabled: true
    image: confluentinc/cp-schema-registry
    tag: "7.7.0"
    port: 8081

weaviate:
  enabled: true
  # Defaults to the Weaviate Helm chart values
  storage:
    size: 20Gi

# Service account + RBAC
serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
  # Operator needs cluster-wide read on pods/deployments/events + write on
  # the SentinelIncident CRD. Tighten in production if needed.
  clusterScope: true

# Ingress for the UI
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: sentinel.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Node selector / tolerations / affinity (applied to all services)
nodeSelector: {}
tolerations: []
affinity: {}

# NetworkPolicy — deny-by-default, only allow Sentinel namespace + needed egress
networkPolicy:
  enabled: false  # set to true in production

# Postgres HA — production should use 2+ replicas + backups
postgres:
  enabled: true
  auth:
    username: sentinel
    password: sentinel  # CHANGE IN PRODUCTION
    database: sentinel
  primary:
    persistence:
      size: 10Gi
  # HA settings (uncomment for production)
  # architecture: replication
  # readReplicas:
  #   replicaCount: 1
  # Backup CronJob — runs pg_dump every 6 hours, uploads to S3
  backup:
    enabled: false  # set to true in production
    schedule: "0 */6 * * *"
    s3Bucket: ""
    s3Prefix: "sentinel-backups"
    awsAccessKeyId: ""
    awsSecretAccessKey: ""
