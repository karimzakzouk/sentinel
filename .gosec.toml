# gosec configuration — excludes false positives specific to Sentinel.
# Run: gosec -conf=.gosec.toml ./...

[global]
# Exclude the embedded web build artifacts + test files.
exclude_dirs = ["internal/web/out"]

# Rules excluded because they're false positives in Sentinel's context:
#
# G101 (hardcoded credentials): flags struct field names like "apiKey" in
#   kaniko.go — these are field names, not actual credentials.
# G115 (integer overflow): flags uint64->byte in UUIDv7 generation,
#   rune->uint32 in TF-IDF hashing, int->int32 in config. All values are
#   bounded by construction — no overflow possible.
# G118 (goroutine context.Background): flags async goroutines in chatops
#   that intentionally outlive the HTTP request (e.g. sandbox retry).
# G122 (TOCTOU in WalkDir): flags repo/cloner.go. Already mitigated by
#   path confinement in ReadFile (absolute/parent-escape/symlink-escape
#   all rejected).
# G204 (subprocess with variable): flags sentinelctl/app.go (open browser)
#   + sentinel-bench/runner.go (run kind/kubectl). These are CLI tools
#   that intentionally run subprocesses with user-provided arguments.
# G404 (weak random): flags chaos/runner.go which uses math/rand for
#   picking random chaos targets — not security-sensitive.
# G702 (command injection): flags the same subprocess calls as G204.
# G703 (path traversal): flags sentinelctl/config.go which reads a
#   user-specified file path — that's the feature.
# G704 (SSRF): flags sentinelctl/client.go which connects to a
#   user-specified server URL — that's the whole point of a CLI client.
exclude_rules = [
  "G101",
  "G115",
  "G118",
  "G122",
  "G204",
  "G404",
  "G702",
  "G703",
  "G704",
]
