[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-common"
version = "1.0.0"
description = "Shared Pydantic schemas, config, and helpers for Sentinel"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "aiokafka>=0.11",
    "asyncpg>=0.29",
]

[tool.setuptools.packages.find]
include = ["sentinel_common*"]
