[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-reasoning"
version = "1.0.0"
description = "Sentinel Layer 3 — multi-agent LangGraph reasoning engine"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "langgraph>=0.2",
    "langchain-openai>=0.1",
    "openai>=1.30",
    "pydantic>=2.5",
    "tenacity>=8.2",
    "httpx>=0.27",
    "weaviate-client>=4.5",
    "pygithub>=2.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "sentinel-common @ file:../common",
]
