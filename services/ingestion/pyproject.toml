[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ingestion"
version = "1.0.0"
description = "Sentinel Layer 1 — data ingestion service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "kubernetes>=29",
    "sentinel-common @ file:../common",
]

[project.scripts]
sentinel-ingestion = "main:main"
