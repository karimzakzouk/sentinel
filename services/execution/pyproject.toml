[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-execution"
version = "1.0.0"
description = "Sentinel Layer 5 — execution (GitHub PRs, K8s API, Terraform)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pygithub>=2.1",
    "kubernetes>=29",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "sentinel-common @ file:../common",
]
