[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-feedback"
version = "1.0.0"
description = "Sentinel Layer 6 — feedback loop (Weaviate + Beta tracker + postmortem)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "weaviate-client>=4.5",
    "openai>=1.30",
    "tenacity>=8.2",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "sentinel-common @ file:../common",
]
