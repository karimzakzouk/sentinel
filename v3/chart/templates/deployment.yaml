{{/*
Single-pod deployment for Sentinel v3. One container, no sidecars.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name | default .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sentinel
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SENTINEL_LLM_PROVIDER
              value: {{ .Values.sentinel.llm.provider | quote }}
            - name: SENTINEL_LLM_BASE_URL
              value: {{ .Values.sentinel.llm.baseUrl | quote }}
            - name: SENTINEL_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: llmApiKey
            - name: SENTINEL_LLM_FAST_MODEL
              value: {{ .Values.sentinel.llm.fastModel | quote }}
            - name: SENTINEL_LLM_FRONTIER_MODEL
              value: {{ .Values.sentinel.llm.frontierModel | quote }}
            - name: SENTINEL_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: githubToken
            - name: SENTINEL_DOCKER_HUB_USERNAME
              value: {{ .Values.sentinel.dockerHubUsername | default "" | quote }}
            - name: SENTINEL_DOCKER_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: dockerHubToken
                  optional: true
            - name: SENTINEL_PRODUCTION_NAMESPACES
              value: {{ .Values.sentinel.productionNamespaces | quote }}
            - name: SENTINEL_WRITE_NAMESPACES
              value: {{ join "," .Values.sentinel.rbac.writeNamespaces | quote }}
            - name: SENTINEL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SENTINEL_RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: PORT
              value: "8000"
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
  labels:
    app.kubernetes.io/name: sentinel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sentinel
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/instance: {{ .Release.Name }}
