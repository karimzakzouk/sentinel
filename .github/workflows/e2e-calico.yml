# The Calico run proves the path where NetworkPolicy is enforced. It is
# slower, so it runs when the code it covers changes, weekly, and on demand.
name: E2E Calico

on:
  push:
    branches: [main]
    paths:
      - internal/capability/**
      - charts/sentinel/templates/lab.yaml
      - hack/kind-up.sh
      - hack/kind/**
      - test/e2e/**
      - .github/workflows/e2e-calico.yml
      - .github/workflows/e2e-run.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-calico-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: kind (Calico, NetworkPolicy enforced)
    uses: ./.github/workflows/e2e-run.yml
    with:
      network: calico
