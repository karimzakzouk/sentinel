name: Release

# Tag-driven release: push a vX.Y.Z tag and this workflow builds, publishes
# the multi-arch Docker image (signed via cosign + SBOM attached), packages
# the Helm chart, and creates the GitHub Release.
#
# Multi-arch build uses native ARM64 runners (no QEMU):
#   - amd64 on ubuntu-latest
#   - arm64 on ubuntu-24.04-arm
#   - Both arches build in parallel, then merged into a multi-arch manifest.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  DH_REGISTRY: docker.io
  DH_OWNER: karimzakzouk
  GHCR_REGISTRY: ghcr.io
  GHCR_OWNER: karimzakzouk

jobs:
  test:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Go tests (with race detector)
        run: go test ./... -race -count=1
      - name: Build binary
        run: |
          go build -ldflags='-s -w' -trimpath -o /tmp/sentinel ./cmd/sentinel
          ls -lh /tmp/sentinel
      - name: Helm lint
        run: helm lint chart/
      - name: Helm template
        run: |
          helm template test chart/ > /tmp/rendered.yaml
          test $(grep -c "kind:" /tmp/rendered.yaml) -ge 6

  build:
    name: Build ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ env.DH_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version
        id: version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            if [[ "${TAG_VERSION}" != "${FILE_VERSION}" ]]; then
              echo "ERROR: git tag version (${TAG_VERSION}) does not match VERSION file (${FILE_VERSION})"
              exit 1
            fi
            echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=${FILE_VERSION}-dev" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
      - name: Build and push (${{ matrix.arch }} only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  merge:
    name: Merge + Sign + Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ env.DH_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get version
        id: version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=${FILE_VERSION}-dev" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
      - name: Create multi-arch manifests
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Docker Hub
          docker manifest create ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:${VERSION} \
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:${VERSION}-amd64 \
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:${VERSION}-arm64
          docker manifest push ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:${VERSION}
          docker manifest create ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:latest \
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:${VERSION}-amd64 \
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:${VERSION}-arm64
          docker manifest push ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:latest
          # GHCR
          docker manifest create ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${VERSION} \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${VERSION}-amd64 \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${VERSION}-arm64
          docker manifest push ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${VERSION}
          docker manifest create ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:latest \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${VERSION}-amd64 \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${VERSION}-arm64
          docker manifest push ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Sign images (keyless via OIDC)
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cosign sign --yes ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:${VERSION}
          cosign sign --yes ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${VERSION}
          cosign sign --yes ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel:latest
          cosign sign --yes ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:latest

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.9
        with:
          image: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${{ steps.version.outputs.version }}
          format: spdx-json
          output-file: /tmp/sbom.spdx.json

      - name: Attach SBOM to image
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cosign attach sbom --sbom /tmp/sbom.spdx.json \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel:${VERSION}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Package chart
        run: |
          helm package chart/ -d /tmp/ --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.version }}
          ls -lh /tmp/sentinel-*.tgz

      - name: Create GitHub Release
        if: steps.version.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sentinel ${{ github.ref_name }}
          body: |
            ## Install

            ```bash
            helm repo add sentinel https://karimzakzouk.github.io/sentinel/
            helm repo update
            helm install sentinel sentinel/sentinel --version ${{ steps.version.outputs.version }} \
              --namespace sentinel --create-namespace \
              --set sentinel.githubToken=YOUR_GITHUB_TOKEN \
              --set sentinel.llm.apiKey=YOUR_LLM_API_KEY
            ```

            ## What's in this release

            See [CHANGELOG.md](https://github.com/karimzakzouk/sentinel/blob/main/CHANGELOG.md) for the full changelog.

            ## Verification

            - Image is signed via cosign (keyless OIDC). Verify with:
              ```bash
              cosign verify ghcr.io/karimzakzouk/sentinel:${{ steps.version.outputs.version }} \
                --certificate-identity-regexp 'https://github.com/karimzakzouk/sentinel/.github/workflows/' \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com
              ```
            - SBOM (SPDX) attached to the image. Download with:
              ```bash
              cosign download sbom ghcr.io/karimzakzouk/sentinel:${{ steps.version.outputs.version }}
              ```
          files: |
            /tmp/sentinel-${{ steps.version.outputs.version }}.tgz
            /tmp/sbom.spdx.json
          generate_release_notes: true

      - name: Publish to GitHub Pages (Helm repo)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          rm -rf /tmp/gh-pages
          git clone --branch gh-pages --depth 1 \
            https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} \
            /tmp/gh-pages 2>/dev/null || mkdir -p /tmp/gh-pages
          cd /tmp/gh-pages
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cp /tmp/sentinel-${{ steps.version.outputs.version }}.tgz .
          helm repo index . --url https://karimzakzouk.github.io/sentinel/
          touch .nojekyll
          git add -A
          git commit -m "Publish chart v${{ steps.version.outputs.version }}" || true
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages --force
