# Proves the capability report's NetworkPolicy answer against network plugins
# with known behavior: Calico always enforces policy, Flannel never does. It
# runs when the code it covers changes, weekly, and on demand.
name: E2E network plugins

on:
  push:
    branches: [main]
    paths:
      - internal/capability/**
      - charts/sentinel/templates/lab.yaml
      - hack/kind-up.sh
      - hack/kind/**
      - test/e2e/**
      - .github/workflows/e2e-cni.yml
      - .github/workflows/e2e-run.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-cni-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: kind
    strategy:
      fail-fast: false
      matrix:
        network: [calico, flannel]
    uses: ./.github/workflows/e2e-run.yml
    with:
      network: ${{ matrix.network }}
