name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the common package (real editable install)
          pip install -e services/common
          # Install all runtime + test deps directly (avoids the flat-layout
          # setuptools issue when installing services/* as packages)
          pip install pytest pytest-asyncio langgraph langchain-openai openai \
                      pygithub kubernetes kopf weaviate-client scikit-learn \
                      httpx tenacity "sqlalchemy[asyncio]" asyncpg fastapi \
                      uvicorn aiokafka prometheus-client

      - name: Build chart dependencies (for helm template tests)
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Build chart dependencies
        run: helm dependency build chart/

      - name: Run pytest
        env:
          PYTHONPATH: services/common:services/ingestion:services/detection:services/reasoning:services/safety:services/execution:services/feedback:services/operator
        run: pytest tests/ --tb=short -v

  helm-lint:
    name: Helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Build chart dependencies
        run: helm dependency build chart/

      - name: Lint chart
        run: helm lint chart/

      - name: Template chart (default provider)
        run: |
          helm template chart/ \
            --set sentinel.githubToken=test \
            --set sentinel.llm.apiKey=test > /tmp/default.yaml
          echo "Rendered $(wc -l < /tmp/default.yaml) lines"

      - name: Template chart (litellm provider)
        run: |
          helm template chart/ \
            --set sentinel.llm.provider=litellm \
            --set sentinel.githubToken=test \
            --set sentinel.llm.apiKey=test > /tmp/litellm.yaml
          echo "Rendered $(wc -l < /tmp/litellm.yaml) lines"
          # Verify the litellm sidecar is present
          grep -q "kind: Deployment" /tmp/litellm.yaml
          grep -q "litellm" /tmp/litellm.yaml

      - name: Validate example values
        run: |
          # The example file uses REPLACE_ME placeholders — substitute them for lint
          sed 's/REPLACE_ME/test-token/g' examples/my-values.yaml > /tmp/test-values.yaml
          helm lint chart/ -f /tmp/test-values.yaml
          helm template chart/ -f /tmp/test-values.yaml > /tmp/rendered.yaml
          echo "Rendered $(wc -l < /tmp/rendered.yaml) lines"
