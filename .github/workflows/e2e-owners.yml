# Runs the owner adapters' end-to-end tests: Argo CD or Flux is installed
# in a kind cluster, deploys a public example, and Sentinel rolls back a bad
# image delivered through it. It runs when the adapters or the Brain that
# decides on them change, weekly, and on demand, so the main suite stays
# fast.
name: E2E owners

on:
  push:
    branches: [main]
    paths:
      - internal/actor/**
      - internal/act/**
      - internal/brain/**
      - charts/sentinel/templates/rbac.yaml
      - charts/sentinel-fence/**
      - test/e2e/argocd_test.go
      - test/e2e/flux_test.go
      - test/apps/argocd-project.yaml
      - hack/e2e-up.sh
      - .github/workflows/e2e-owners.yml
      - .github/workflows/e2e-run.yml
  schedule:
    - cron: "17 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-owners-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argocd:
    name: Argo CD
    uses: ./.github/workflows/e2e-run.yml
    with:
      network: kindnet
      label: -argocd
      argocd: true
      run: TestArgoCD
  flux:
    name: Flux
    uses: ./.github/workflows/e2e-run.yml
    with:
      network: kindnet
      label: -flux
      flux: true
      run: TestFlux
