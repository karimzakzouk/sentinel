name: CI

# PR-level CI — runs on every push to main and every pull request.
# The release workflow (release-v3.yml) only runs on tag push, so PRs previously
# got zero signal until release time. This catches regressions at PR stage.
#
# Jobs:
#   1. lint   — golangci-lint (catches dead code, unused vars, shadowing, etc.)
#   2. test   — go test -race + go build + helm lint
#   3. security — go vet + govulncheck (CVE scan on dependencies)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Golangci-lint v2.x requires action v7 (v6 doesn't support v2 format).
          # v2.x is needed because v1.x was built with Go 1.23 and can't lint Go 1.25 code.
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: go.sum

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Go tests (with race detector)
        run: go test ./... -race -count=1

      - name: Build binary (verify it compiles)
        run: |
          # VERSION is sourced from the VERSION file (single source of truth).
          VERSION=$(cat VERSION | tr -d '[:space:]')
          go build -ldflags="-s -w -X main.Version=${VERSION} -X github.com/karimzakzouk/sentinel/internal/version.Version=${VERSION}" -trimpath -o /tmp/sentinel ./cmd/sentinel
          ls -lh /tmp/sentinel

      - name: Helm lint
        run: helm lint chart/

      - name: Helm template (verify chart renders)
        run: |
          helm template test chart/ > /tmp/rendered.yaml
          test $(grep -c "kind:" /tmp/rendered.yaml) -ge 6

      - name: Version sync check
        # VERSION file is the single source of truth. scripts/sync-version.py
        # rewrites every other file (Chart.yaml, values.yaml, my-values.yaml,
        # web/package.json, README.md, version.go) to match. This step fails
        # the build if any of them drift.
        run: make check-version

  web:
    # H33 — verify the Next.js web build in CI. Was: only built at
    # release time, so broken web/ changes merged to main and only failed
    # when the release was tagged.
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies (npm ci)
        run: npm ci
        working-directory: web
      - name: Build Next.js (with TS + ESLint checks)
        run: npx next build
        working-directory: web
      - name: Verify output exists
        run: test -f web/out/index.html

  container-scan:
    # M44 — Trivy scan on the built Docker image for OS-level CVEs.
    # govulncheck only scans Go source deps; this catches distroless base image
    # vulnerabilities + bundled ca-certificates issues.
    name: Container CVE scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: sentinel:ci-scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sentinel:ci-scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  security:
    name: Security scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.4"
          cache: true
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
