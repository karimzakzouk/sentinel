# Lint, unit tests and build on the self-hosted Azure runner. A short
# GitHub-hosted wake job starts the VM when Actions minutes remain; with a
# $0 budget it is allowed to fail so a VM already running (or woken with
# hack/azure-runner/wake.sh) can still take the job.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wake:
    name: wake the runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            hack/azure-runner
      - uses: ./.github/actions/wake-runner
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          resource-group: ${{ vars.RUNNER_RESOURCE_GROUP || 'sentinel-ci' }}
          vm-name: ${{ vars.RUNNER_VM_NAME }}

  check:
    name: Lint, test, build
    needs: [wake]
    if: ${{ !cancelled() && (needs.wake.result == 'success' || needs.wake.result == 'failure') }}
    runs-on: [self-hosted, sentinel-lab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The self-hosted runner keeps its Go caches on disk.
          cache: false
      - name: Install pinned tools
        run: hack/install-tools.sh
      - name: Generated files and go.mod are up to date
        run: make verify
      - run: make lint
      - run: make vuln
      - run: make test
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Type-check and build the UI
        run: make ui
      - run: make build
      - run: make helm-lint
      - run: make scenarios
