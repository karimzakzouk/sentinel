name: CI

# v3.4.0: PR-level CI — runs on every push to main and every pull request.
# The release workflow (release-v3.yml) only runs on tag push, so PRs previously
# got zero signal until release time. This catches regressions at PR stage.
#
# Jobs:
#   1. lint   — golangci-lint (catches dead code, unused vars, shadowing, etc.)
#   2. test   — go test -race + go build + helm lint
#   3. security — go vet + govulncheck (CVE scan on dependencies)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v3.5.0: golangci-lint v2.x requires action v7 (v6 doesn't support v2 format).
          # v2.x is needed because v1.x was built with Go 1.23 and can't lint Go 1.25 code.
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Go tests (with race detector)
        run: go test ./... -race -count=1

      - name: Build binary (verify it compiles)
        run: |
          # v3.8.4: VERSION is sourced from the VERSION file (single source of truth).
          VERSION=$(cat VERSION | tr -d '[:space:]')
          go build -ldflags="-s -w -X main.Version=${VERSION} -X github.com/karimzakzouk/sentinel/v3/internal/version.Version=${VERSION}" -trimpath -o /tmp/sentinel ./cmd/sentinel
          ls -lh /tmp/sentinel

      - name: Helm lint
        run: helm lint chart/

      - name: Helm template (verify chart renders)
        run: |
          helm template test chart/ > /tmp/rendered.yaml
          test $(grep -c "kind:" /tmp/rendered.yaml) -ge 6

      - name: Version sync check (v3.8.4)
        run: |
          # VERSION is the single source of truth. Chart.yaml, values.yaml,
          # and the README helm-install examples must all agree with it.
          V=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $V"
          CHART_V=$(grep '^version:' chart/Chart.yaml | awk '{print $2}')
          CHART_AV=$(grep '^appVersion:' chart/Chart.yaml | sed 's/appVersion: "//;s/"//')
          VALUES_V=$(grep '^  tag:' chart/values.yaml | sed 's/.*tag: "//;s/"//')
          echo "Chart.yaml version:    $CHART_V"
          echo "Chart.yaml appVersion: $CHART_AV"
          echo "values.yaml image.tag: $VALUES_V"
          if [[ "$V" != "$CHART_V" ]] || [[ "$V" != "$CHART_AV" ]] || [[ "$V" != "$VALUES_V" ]]; then
            echo "FAIL: version drift detected. Run 'make release-bump' to sync."
            exit 1
          fi
          echo "All versions in sync: $V"

  security:
    name: Security scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
