name: CI

# PR-level CI: lint + test + build + helm + version-sync + web build +
# container scan + govulncheck + gosec + CodeQL.

on:
  push:
    branches: [main, v1]
  pull_request:
    branches: [main, v1]

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Test + Build + Helm + Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Go tests (with race detector)
        run: go test ./... -race -count=1
      - name: Build binary (verify it compiles)
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          go build -ldflags="-s -w -X main.Version=${VERSION} -X github.com/karimzakzouk/sentinel/internal/version.Version=${VERSION}" -trimpath -o /tmp/sentinel ./cmd/sentinel
          ls -lh /tmp/sentinel
      - name: Build CLI binary
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          go build -ldflags="-s -w -X main.Version=${VERSION}" -trimpath -o /tmp/sentinelctl ./cmd/sentinelctl
          ls -lh /tmp/sentinelctl
      - name: Helm lint
        run: helm lint chart/
      - name: Helm template (verify chart renders)
        run: |
          helm template test chart/ > /tmp/rendered.yaml
          test $(grep -c "kind:" /tmp/rendered.yaml) -ge 6
      - name: Helm template (all features enabled)
        run: |
          helm template test chart/ \
            --set ingress.enabled=true \
            --set 'sentinel.rbac.writeNamespaces={sim,staging}' \
            --set sentinel.rbac.readSecrets=true \
            --set networkPolicy.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set metrics.serviceMonitor.enabled=true > /tmp/rendered-full.yaml
          test $(grep -c "kind:" /tmp/rendered-full.yaml) -ge 12
      - name: Version sync check
        run: python3 scripts/sync-version.py --check

  web:
    name: Web build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check if web UI exists
        id: check
        run: test -f web/package.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        run: npm install
        working-directory: web
      - name: Build Next.js
        if: steps.check.outputs.exists == 'true'
        run: npx next build
        working-directory: web
      - name: Verify output exists
        if: steps.check.outputs.exists == 'true'
        run: test -f web/out/index.html

  container-scan:
    name: Container CVE scan (trivy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Check if web UI exists
        id: check
        run: test -f web/package.json && echo "exists=true" >> $GITHUB_OUTPUT || echo "exists=false" >> $GITHUB_OUTPUT
      - name: Build image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: sentinel:ci-scan
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        if: steps.check.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinel:ci-scan
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  govulncheck:
    name: Go vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Go security scan (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir=internal/web/out ./...

  codeql:
    name: CodeQL semantic analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
