name: E2E

on:
  push:
    branches: [main]
    paths:
      - api/**
      - cmd/**
      - internal/**
      - charts/**
      - test/**
      - hack/**
      - Dockerfile
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/e2e.yml
      - .github/workflows/e2e-run.yml
  pull_request:
    paths:
      - api/**
      - cmd/**
      - internal/**
      - charts/**
      - test/**
      - hack/**
      - Dockerfile
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/e2e.yml
      - .github/workflows/e2e-run.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: kind (kindnet)
    uses: ./.github/workflows/e2e-run.yml
    with:
      network: kindnet
      # Hosted Actions minutes are spent; run on the Azure self-hosted
      # runner. The Lab's full matrix stays in E2E network plugins.
      self-hosted: true
      skip: TestTheLab|TestALab
