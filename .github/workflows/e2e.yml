name: E2E (kind)

# Real-cluster smoke test: install Sentinel into a fresh kind cluster, deploy
# a deliberately-crashing service annotated with sentinel.io/repo, and assert
# that the detection layer files an incident. Runs the same code path
# production uses (K8s watch → CrashLoopBackOff → incident) without needing
# a real LLM key — the investigation will fail on the dummy key, but the
# incident existing proves detection works end-to-end.
#
# Not on every PR (adds ~6 min); run manually or on the weekly schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

permissions:
  contents: read

jobs:
  e2e:
    name: Detect → Incident (kind cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
          cache-dependency-path: go.sum

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: sentinel-e2e
          wait: 60s

      - name: Build image
        run: docker build -t sentinel:e2e .

      - name: Load image into kind
        run: |
          # Load under the fully-qualified ref the chart will request
          # (image.registry=docker.io/library below): containerd on the kind
          # node normalizes 'sentinel:e2e' to 'docker.io/library/sentinel:e2e',
          # and pullPolicy=Never requires an exact local match.
          docker tag sentinel:e2e docker.io/library/sentinel:e2e
          kind load docker-image docker.io/library/sentinel:e2e --name sentinel-e2e

      - name: Install Sentinel
        run: |
          helm install sentinel ./chart \
            --namespace sentinel --create-namespace \
            --set image.registry=docker.io/library \
            --set image.repository=sentinel \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set sentinel.llm.apiKey=dummy-key-for-e2e \
            --set sentinel.githubToken=dummy-token-for-e2e \
            --wait --timeout 300s

      - name: Diagnose install failure
        if: failure()
        run: |
          echo "=== pods ==="
          kubectl -n sentinel get pods -o wide || true
          echo "=== describe ==="
          kubectl -n sentinel describe pod -l app.kubernetes.io/name=sentinel || true
          echo "=== events ==="
          kubectl -n sentinel get events --sort-by=.lastTimestamp | tail -30 || true
          for p in $(kubectl -n sentinel get pod -o name 2>/dev/null); do
            echo "=== logs $p ==="
            kubectl -n sentinel logs "$p" --tail=80 || true
          done

      - name: Deploy crashing service (the "fake repo" scenario)
        run: |
          kubectl create namespace sim
          cat <<'EOF' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: crashy
            namespace: sim
            annotations:
              sentinel.io/repo: karimzakzouk/sentinel
          spec:
            replicas: 1
            selector:
              matchLabels: { app: crashy }
            template:
              metadata:
                labels: { app: crashy }
                annotations:
                  sentinel.io/repo: karimzakzouk/sentinel
              spec:
                containers:
                  - name: crashy
                    image: busybox:1.36
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        echo "Traceback (most recent call last):"
                        echo "KeyError: 'MISSING_ENV_VAR'"
                        exit 1
          EOF

      - name: Wait for pod to enter CrashLoopBackOff
        run: |
          for i in $(seq 1 30); do
            STATE=$(kubectl -n sim get pod -l app=crashy -o jsonpath='{.items[0].status.containerStatuses[0].state.waiting.reason}' 2>/dev/null || true)
            if [ "$STATE" = "CrashLoopBackOff" ]; then
              echo "Pod is in CrashLoopBackOff after ${i}0s"
              exit 0
            fi
            sleep 10
          done
          echo "Pod never reached CrashLoopBackOff"
          kubectl -n sim get all -o wide
          exit 1

      - name: Assert Sentinel detected the incident
        run: |
          SENTINEL_POD=$(kubectl -n sentinel get pod -l app.kubernetes.io/name=sentinel -o name | head -1)
          if [ -z "$SENTINEL_POD" ]; then
            # Fall back to the only pod in the namespace.
            SENTINEL_POD=$(kubectl -n sentinel get pod -o name | head -1)
          fi
          echo "Sentinel pod: $SENTINEL_POD"
          for i in $(seq 1 24); do
            BODY=$(kubectl -n sentinel exec "$SENTINEL_POD" -- \
              wget -qO- http://localhost:8000/incidents 2>/dev/null || true)
            if echo "$BODY" | grep -q '"service":"crashy"'; then
              echo "=== Incident detected ==="
              echo "$BODY" | head -c 2000
              echo
              exit 0
            fi
            echo "attempt $i: no incident for service 'crashy' yet..."
            sleep 10
          done
          echo "=== FAIL: Sentinel never created an incident for crashy ==="
          kubectl -n sentinel logs "$SENTINEL_POD" --tail=100 || true
          exit 1
