# Runs the end-to-end suite on an older Kubernetes version than kind's
# default. Kubernetes changes how it reports container states between
# versions (1.37 shows a crash loop's back-off as "terminated"), so the code
# that reads them is proven on both. It runs when that code changes, weekly,
# and on demand.
name: E2E Kubernetes versions

on:
  push:
    branches: [main]
    paths:
      - internal/watcher/facts.go
      - internal/watcher/logs.go
      - internal/harness/**
      - hack/kind-up.sh
      - hack/kind/**
      - .github/workflows/e2e-k8s-versions.yml
      - .github/workflows/e2e-run.yml
  schedule:
    - cron: "41 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-k8s-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: kind
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest node image kind v0.33.0 publishes.
          - version: "1.34"
            image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    uses: ./.github/workflows/e2e-run.yml
    with:
      network: kindnet
      node-image: ${{ matrix.image }}
      label: -k8s-${{ matrix.version }}
