name: Build & Publish Docker Images

# Builds all Sentinel service images and pushes them to BOTH:
#   - Docker Hub: docker.io/karimzakzouk/sentinel/* (DEFAULT for chart)
#   - GitHub Container Registry: ghcr.io/karimzakzoukz/sentinel/* (fallback)
#
# Triggered on every release tag (v*.*.*).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (defaults to chart version)"
        required: false
        default: "dev"

permissions:
  contents: read
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  DH_REGISTRY: docker.io
  DH_OWNER: karimzakzouk
  GHCR_OWNER: karimzakzoukz

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: core,       dockerfile: services/core/Dockerfile }
          - { service: ingestion,  dockerfile: services/ingestion/Dockerfile }
          - { service: detection,  dockerfile: services/detection/Dockerfile }
          - { service: reasoning,  dockerfile: services/reasoning/Dockerfile }
          - { service: safety,     dockerfile: services/safety/Dockerfile }
          - { service: execution,  dockerfile: services/execution/Dockerfile }
          - { service: feedback,   dockerfile: services/feedback/Dockerfile }
          - { service: operator,   dockerfile: services/operator/Dockerfile }
          - { service: ui,         dockerfile: ui/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Read chart version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ env.DH_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for image (GHCR)
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/${{ matrix.service }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Sentinel ${{ matrix.service }}
            org.opencontainers.image.description=Sentinel autonomous AI SRE — ${{ matrix.service }} service
            org.opencontainers.image.source=https://github.com/karimzakzoukz/sentinel
            org.opencontainers.image.licenses=MIT

      - name: Build and push ${{ matrix.service }} (GHCR)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push ${{ matrix.service }} (Docker Hub)
        if: ${{ vars.DOCKERHUB_ENABLED == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel/${{ matrix.service }}:${{ steps.version.outputs.version }},${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          # Uses DOCKERHUB_TOKEN secret for auth — only runs when DOCKERHUB_ENABLED var is 'true'

      - name: Summary
        run: |
          echo "### Built and pushed: ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Docker Hub: \`docker.io/${{ env.DH_OWNER }}/sentinel/${{ matrix.service }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "GHCR:       \`ghcr.io/${{ env.GHCR_OWNER }}/sentinel/${{ matrix.service }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Also tagged as: \`latest\` on both registries" >> $GITHUB_STEP_SUMMARY
