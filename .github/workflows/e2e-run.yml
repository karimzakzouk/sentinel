name: E2E run

on:
  workflow_call:
    inputs:
      network:
        description: kind network plugin, kindnet, calico or flannel
        required: true
        type: string
      node-image:
        description: kind node image, which sets the Kubernetes version; empty for kind's default
        required: false
        type: string
        default: ""
      label:
        description: suffix for the job and artifact names
        required: false
        type: string
        default: ""
      argocd:
        description: install Argo CD and let the actor pause its Applications
        required: false
        type: boolean
        default: false
      flux:
        description: install Flux and let the actor suspend its Kustomizations
        required: false
        type: boolean
        default: false
      run:
        description: regular expression naming the tests to run; empty runs the suite
        required: false
        type: string
        default: ""
      skip:
        description: regular expression naming the tests to leave out
        required: false
        type: string
        default: ""
      self-hosted:
        description: run on Sentinel's self-hosted Azure runner, waking it first
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The self-hosted runner deallocates itself when idle; a GitHub-hosted
  # minute starts it.
  wake:
    name: wake the runner
    if: inputs.self-hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions
            hack/azure-runner
      - uses: ./.github/actions/wake-runner
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          resource-group: ${{ vars.RUNNER_RESOURCE_GROUP || 'sentinel-ci' }}
          vm-name: ${{ vars.RUNNER_VM_NAME }}

  run:
    name: ${{ inputs.network }}${{ inputs.label }}
    needs: [wake]
    if: ${{ !cancelled() && (needs.wake.result == 'success' || needs.wake.result == 'skipped') }}
    runs-on: ${{ inputs.self-hosted && fromJSON('["self-hosted", "sentinel-lab"]') || 'ubuntu-24.04' }}
    timeout-minutes: 50
    env:
      E2E_CLUSTER: sentinel-e2e
      E2E_NETWORK: ${{ inputs.network }}
      KIND_NODE_IMAGE: ${{ inputs.node-image }}
      E2E_ARGOCD: ${{ inputs.argocd && '1' || '' }}
      E2E_FLUX: ${{ inputs.flux && '1' || '' }}
      E2E_RUN: ${{ inputs.run }}
      E2E_SKIP: ${{ inputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The self-hosted runner keeps its Go caches on disk; restoring
          # GitHub's copy over them only fails file by file.
          cache: ${{ !inputs.self-hosted }}
      - name: Install pinned tools
        run: hack/install-tools.sh
      # A self-hosted runner keeps what earlier jobs left, and kind-up.sh
      # reuses an existing cluster.
      - name: Clear earlier jobs' clusters
        if: inputs.self-hosted
        run: |
          kind delete clusters --all
          docker container prune --force
      - name: Bring up the cluster, Sentinel and the test workloads
        run: make e2e-up
      - name: End-to-end tests
        run: make e2e
      - name: Collect diagnostics
        if: failure()
        run: hack/e2e-diagnose.sh > e2e-diagnostics.txt 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-diagnostics-${{ inputs.network }}${{ inputs.label }}
          path: e2e-diagnostics.txt
          retention-days: 7
      - name: Delete the cluster
        if: always() && inputs.self-hosted
        run: kind delete clusters --all
