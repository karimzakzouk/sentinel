name: E2E run

on:
  workflow_call:
    inputs:
      network:
        description: kind network plugin, kindnet, calico or flannel
        required: true
        type: string
      node-image:
        description: kind node image, which sets the Kubernetes version; empty for kind's default
        required: false
        type: string
        default: ""
      label:
        description: suffix for the job and artifact names
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.network }}${{ inputs.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_CLUSTER: sentinel-e2e
      E2E_NETWORK: ${{ inputs.network }}
      KIND_NODE_IMAGE: ${{ inputs.node-image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install pinned tools
        run: hack/install-tools.sh
      - name: Bring up the cluster, Sentinel and the test workloads
        run: make e2e-up
      - name: End-to-end tests
        run: make e2e
      - name: Collect diagnostics
        if: failure()
        run: hack/e2e-diagnose.sh > e2e-diagnostics.txt 2>&1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-diagnostics-${{ inputs.network }}${{ inputs.label }}
          path: e2e-diagnostics.txt
          retention-days: 7
