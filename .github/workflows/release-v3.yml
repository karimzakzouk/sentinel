name: Release v3

# v3.12.0: Multi-arch build using native ARM64 runners (no QEMU).
#   - amd64 on ubuntu-latest (x86_64 runner)
#   - arm64 on ubuntu-24.04-arm (free native ARM64 runner for public repos)
#   - Both arches build in parallel, then merged into a multi-arch manifest.
#   - Build time: ~4 min (was ~10-15 min with QEMU emulation).
#
# v3.12.0: Also fixes stale release notes (was "What's New in v3.5.0").

on:
  push:
    tags:
      - "v3.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  DH_REGISTRY: docker.io
  DH_OWNER: karimzakzouk
  GHCR_REGISTRY: ghcr.io
  GHCR_OWNER: karimzakzouk

jobs:
  test:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Go tests (with race detector)
        run: go test ./... -race -count=1

      - name: Build binary (verify it compiles + check size)
        run: |
          go build -ldflags='-s -w' -trimpath -o /tmp/sentinel ./cmd/sentinel
          ls -lh /tmp/sentinel
          # Verify it runs
          /tmp/sentinel --help 2>&1 | head -5 || true

      - name: Helm lint
        run: helm lint chart/

      - name: Helm template (verify chart renders)
        run: |
          helm template test chart/ > /tmp/rendered.yaml
          test $(grep -c "kind:" /tmp/rendered.yaml) -ge 6

  # v3.12.0: Build each arch natively in parallel (no QEMU).
  # Each job pushes a single-arch image with an arch suffix (e.g. :3.12.0-amd64).
  # The merge job below combines them into a multi-arch manifest.
  build:
    name: Build ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ env.DH_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ "${GITHUB_REF}" == refs/tags/v3* ]]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            if [[ "${TAG_VERSION}" != "${FILE_VERSION}" ]]; then
              echo "ERROR: git tag version (${TAG_VERSION}) does not match VERSION file (${FILE_VERSION})"
              exit 1
            fi
            echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=${FILE_VERSION}-dev" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (${{ matrix.arch }} only)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:${{ steps.version.outputs.version }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          # v3.13.0 fix: provenance=false prevents build-push-action from creating
          # a manifest list for single-arch builds. Without this, the merge job
          # fails with "X-amd64 is a manifest list" when trying to create the
          # multi-arch manifest. provenance=false pushes a plain single-arch image.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  # v3.12.0: Merge the two single-arch images into a multi-arch manifest.
  # Also packages the Helm chart + creates the GitHub Release + publishes gh-pages.
  merge:
    name: Merge + Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ env.DH_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          if [[ "${GITHUB_REF}" == refs/tags/v3* ]]; then
            TAG_VERSION=${GITHUB_REF_NAME#v}
            echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=${FILE_VERSION}-dev" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Create multi-arch manifests
        run: |
          VERSION=${{ steps.version.outputs.version }}
          
          # Docker Hub
          docker manifest create ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:${VERSION} \
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:${VERSION}-amd64 \
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:${VERSION}-arm64
          docker manifest push ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:${VERSION}
          
          docker manifest create ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:latest \
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:${VERSION}-amd64 \
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:${VERSION}-arm64
          docker manifest push ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:latest
          
          # GHCR
          docker manifest create ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:${VERSION} \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:${VERSION}-amd64 \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:${VERSION}-arm64
          docker manifest push ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:${VERSION}
          
          docker manifest create ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:latest \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:${VERSION}-amd64 \
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:${VERSION}-arm64
          docker manifest push ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Package chart
        run: |
          helm package chart/ -d /tmp/ --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.version }}
          ls -lh /tmp/sentinel-*.tgz

      - name: Create GitHub Release
        if: steps.version.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sentinel ${{ github.ref_name }}
          body: |
            ## Install (v3 — single Go binary, ~43MB)

            ```bash
            helm repo add sentinel https://karimzakzouk.github.io/sentinel/
            helm repo update
            helm install sentinel sentinel/sentinel --version ${{ steps.version.outputs.version }} \
              --namespace sentinel --create-namespace \
              --set sentinel.githubToken=YOUR_GITHUB_TOKEN \
              --set sentinel.llm.apiKey=YOUR_LLM_API_KEY
            ```

            ## What's New

            ### v3.12.0 — GoAI Integration: 25+ Native LLM Providers

            - **25+ LLM providers natively** — Anthropic, Bedrock, Azure, OpenAI, Google, Vertex, OpenRouter, Groq, Mistral, Cohere, xAI, DeepSeek, Cerebras, Fireworks, Together, Perplexity, Ollama, vLLM. No proxy needed.
            - **Native ARM64 CI** — builds on free GitHub ARM64 runners (no QEMU). Release time halved.
            - **200-with-error-body retry** — handles providers that return HTTP 200 with an error in the JSON body.

            ### v3.11.0 — Codebase Audit Fixes (16 issues)

            - Pure-Go syntax validators (was broken in distroless)
            - Multi-language sandbox Level 3 (was Python-only)
            - GitHub Enterprise / GitLab / Bitbucket support
            - Registry-aware Kaniko (ECR/GCR/ACR/Harbor/Quay)
            - Configurable default branch, namespace skip list, high-risk services
            - 6 dead config fields wired
            - Language-agnostic prompts

            ### v3.8.2 — UI + GitHub App + Slack Bot

            - Professional Web UI, CLI (sentinelctl), GitHub App, Settings persistence, SSE real-time updates, 24-hour feedback loop, Predictive PR review, Interactive Slack bot, Cross-service correlation, Shared library support, Concurrency limiter, Arm64 support, Production hardening.
          files: /tmp/sentinel-${{ steps.version.outputs.version }}.tgz
          generate_release_notes: true

      - name: Publish to GitHub Pages (Helm repo)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          rm -rf /tmp/gh-pages
          git clone --branch gh-pages --depth 1 \
            https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} \
            /tmp/gh-pages 2>/dev/null || mkdir -p /tmp/gh-pages

          cd /tmp/gh-pages
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          cp /tmp/sentinel-${{ steps.version.outputs.version }}.tgz .
          helm repo index . --url https://karimzakzouk.github.io/sentinel/
          touch .nojekyll
          git add -A
          git commit -m "Publish chart v${{ steps.version.outputs.version }}" || true
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages --force
