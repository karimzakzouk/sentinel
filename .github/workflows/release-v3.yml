name: Release v3

# v3 CI — optimized for speed:
#   - amd64 only (arm64 deferred to v3.1 if anyone asks)
#   - Go cross-compile (no QEMU emulation)
#   - BuildKit cache for go mod + go build
#   - Build time: ~3 min cold, ~1 min cached

on:
  push:
    tags:
      - "v3.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

env:
  DH_REGISTRY: docker.io
  DH_OWNER: karimzakzouk
  GHCR_REGISTRY: ghcr.io
  GHCR_OWNER: karimzakzouk

jobs:
  test:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: go.sum

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Go tests (with race detector)
        run: go test ./... -race -count=1

      - name: Build binary (verify it compiles + check size)
        run: |
          go build -ldflags='-s -w' -trimpath -o /tmp/sentinel ./cmd/sentinel
          ls -lh /tmp/sentinel
          # Verify it runs
          /tmp/sentinel --help 2>&1 | head -5 || true

      - name: Helm lint
        run: helm lint chart/

      - name: Helm template (verify chart renders)
        run: |
          helm template test chart/ > /tmp/rendered.yaml
          test $(grep -c "kind:" /tmp/rendered.yaml) -ge 6

  build-and-push:
    name: Build + Push Image + Chart
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DH_REGISTRY }}
          username: ${{ env.DH_OWNER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v3* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=3.5.0-dev" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (amd64 only, with BuildKit cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:${{ steps.version.outputs.version }}
            ${{ env.DH_REGISTRY }}/${{ env.DH_OWNER }}/sentinel-v3:latest
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:${{ steps.version.outputs.version }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_OWNER }}/sentinel/sentinel-v3:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Package chart
        run: |
          helm package chart/ -d /tmp/ --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.version }}
          ls -lh /tmp/sentinel-*.tgz

      - name: Create GitHub Release
        if: steps.version.outputs.is_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Sentinel ${{ github.ref_name }}
          body: |
            ## Install (v3 — single Go binary, ~28MB)

            ```bash
            helm repo add sentinel https://karimzakzouk.github.io/sentinel/
            helm repo update
            helm install sentinel sentinel/sentinel --version ${{ steps.version.outputs.version }} \
              --namespace sentinel --create-namespace \
              --set sentinel.githubToken=YOUR_GITHUB_TOKEN \
              --set sentinel.llm.apiKey=YOUR_LLM_API_KEY
            ```

            ## What's New in v3.5.0

            - **24-hour feedback loop** — Phase 2 re-occurrence watcher corrects Beta priors when errors reappear in production
            - **Predictive PR review** — GitHub webhook scores PR diffs against incident memory, posts warnings on risky changes
            - **Interactive Slack bot** — Two-way commands: pause, resume, investigate, list incidents, status
            - **Cross-service correlation** — Detects cascading failures (3+ services in 60s), identifies likely cause
            - **Shared library support** — Redirects investigation to library repo when error is in vendor/node_modules
            - **Production readiness** — LLM retry/backoff, structured logging (slog), Prometheus metrics, golangci-lint, govulncheck, configurable timeouts
          files: /tmp/sentinel-${{ steps.version.outputs.version }}.tgz
          generate_release_notes: true

      - name: Publish to GitHub Pages (Helm repo)
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          rm -rf /tmp/gh-pages
          git clone --branch gh-pages --depth 1 \
            https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} \
            /tmp/gh-pages 2>/dev/null || mkdir -p /tmp/gh-pages

          cd /tmp/gh-pages
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          cp /tmp/sentinel-${{ steps.version.outputs.version }}.tgz .
          helm repo index . --url https://karimzakzouk.github.io/sentinel/
          touch .nojekyll
          git add -A
          git commit -m "Publish chart v${{ steps.version.outputs.version }}" || true
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} gh-pages --force
