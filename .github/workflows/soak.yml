# A soak runs Sentinel with production detection settings beside Online
# Boutique, its load generator and the smoke workloads, with nothing
# injected, on the self-hosted runner: every incident it opens is a false
# alarm. The phase 1 gate needs 72 hours. "Run workflow" starts one, and so
# does a push that changes .github/requests/soak.
name: Soak

on:
  push:
    branches: [main]
    paths:
      - .github/requests/soak
  workflow_dispatch:
    inputs:
      hours:
        description: hours to watch, 1 to 72
        type: number
        default: 72

permissions:
  contents: read

concurrency:
  group: soak
  cancel-in-progress: false

jobs:
  # Start the VM with hack/azure-runner/wake.sh when deallocated (decision 99).
  soak:
    name: soak
    runs-on: [self-hosted, sentinel-lab]
    # 72 hours of watching, and the setup and report around them. The runner
    # deallocates itself after 90 hours up, whatever runs.
    timeout-minutes: 4500
    env:
      E2E_CLUSTER: sentinel-soak
      HOURS: ${{ inputs.hours }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install pinned tools
        run: hack/install-tools.sh
      - name: Clear earlier jobs' clusters
        run: |
          kind delete clusters --all
          docker container prune --force
      - name: Bring up the cluster, Sentinel, the smoke app and Online Boutique
        run: |
          make e2e-up
          make boutique-up
      - name: Switch Sentinel to production settings
        run: hack/soak.sh start
      - name: Watch
        env:
          # Stream a false-alarm report into the job log every 10 minutes so
          # the Actions UI shows what the soak has seen so far, not only hourly.
          SOAK_REPORT_EVERY_MIN: "10"
          PYTHONUNBUFFERED: "1"
        run: |
          # A push of the request file has no inputs; it holds the hours.
          HOURS="${HOURS:-$(awk '/^hours:/ {print $2}' .github/requests/soak)}"
          case "$HOURS" in
            '' | *[!0-9]*) echo "::error::hours must be a whole number"; exit 1 ;;
          esac
          if [ "$HOURS" -lt 1 ] || [ "$HOURS" -gt 72 ]; then
            echo "::error::hours must be between 1 and 72"
            exit 1
          fi
          # stdbuf keeps each report line visible in the live job log.
          stdbuf -oL -eL hack/soak.sh watch "$HOURS"
      - name: Report
        if: always()
        run: |
          hack/soak.sh report > soak-report.txt 2>&1 || true
          if [ -f test/results/soak-progress.txt ]; then
            cp test/results/soak-progress.txt soak-progress.txt
          fi
          kubectl --context "kind-$E2E_CLUSTER" -n sentinel logs deploy/sentinel > controller.log 2>&1 || true
          {
            echo "## Soak"
            echo
            echo "Every incident below is a false alarm: nothing was injected."
            echo
            echo '```'
            cat soak-report.txt
            echo '```'
            if [ -f soak-progress.txt ]; then
              echo
              echo "### Progress log (streamed during the watch)"
              echo
              echo '```'
              # Keep the summary short; full stream is in the artifact.
              tail -n 80 soak-progress.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak
          path: |
            soak-report.txt
            soak-progress.txt
            controller.log
          retention-days: 30
      - name: Delete the cluster
        if: always()
        run: kind delete clusters --all
