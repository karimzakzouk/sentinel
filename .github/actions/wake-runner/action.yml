# Starts Sentinel's self-hosted runner, an Azure VM that deallocates itself
# when idle, through hack/azure-runner/wake.sh, which the checkout must
# include; the queued job then reaches the runner once it is back online.
# The calling step provides the service principal as AZURE_CLIENT_ID,
# AZURE_CLIENT_SECRET, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID.
name: Wake the Azure runner
description: Start the self-hosted runner's VM if it is stopped, and wait until it runs.
inputs:
  resource-group:
    description: the VM's resource group
    required: true
  vm-name:
    description: the VM's name
    required: true
runs:
  using: composite
  steps:
    - name: Start the VM
      shell: bash
      env:
        RUNNER_RESOURCE_GROUP: ${{ inputs.resource-group }}
        RUNNER_VM_NAME: ${{ inputs.vm-name }}
      run: |
        set -euo pipefail
        az login --service-principal --username "$AZURE_CLIENT_ID" --password "$AZURE_CLIENT_SECRET" \
          --tenant "$AZURE_TENANT_ID" --output none
        az account set --subscription "$AZURE_SUBSCRIPTION_ID"
        hack/azure-runner/wake.sh
