---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: actionrequests.sentinel.karimzakzouk.github.io
spec:
  group: sentinel.karimzakzouk.github.io
  names:
    categories:
    - sentinel
    kind: ActionRequest
    listKind: ActionRequestList
    plural: actionrequests
    shortNames:
    - ar
    singular: actionrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .spec.target.name
      name: Target
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ActionRequest asks the actor to run one mitigation through the
          workload's owner.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ActionRequestSpec is the Brain's typed request. It cannot be changed after
              creation, so what was approved is exactly what runs.
            properties:
              action:
                description: |-
                  Action is the action type. Each type has a contract the actor checks
                  before running it.
                enum:
                - rollout.undo
                - scale
                - restart
                - argocd.rollback
                - flux.rollback
                - helm.rollback
                - rollouts.abort
                - flagger.abort
                type: string
              dryRunOnly:
                description: DryRunOnly asks for the server-side dry run and nothing
                  else.
                type: boolean
              expiresAt:
                description: ExpiresAt is when an unapproved request lapses.
                format: date-time
                type: string
              incidentId:
                description: IncidentID links the request to its incident in the Ledger.
                minLength: 1
                type: string
              params:
                additionalProperties:
                  type: string
                description: Params are the action's arguments, validated against
                  its contract.
                maxProperties: 16
                type: object
              reason:
                description: Reason explains the request to the people who approve
                  or veto it.
                maxLength: 2048
                minLength: 1
                type: string
              target:
                description: Target is the object the action changes.
                properties:
                  apiVersion:
                    minLength: 1
                    type: string
                  kind:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                - namespace
                type: object
            required:
            - action
            - expiresAt
            - incidentId
            - reason
            - target
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: ActionRequestStatus is written by the actor.
            properties:
              approvedBy:
                description: ApprovedBy is the identity whose approval let the action
                  run.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ActionPhase is a step in an action request's lifecycle.
                enum:
                - Pending
                - Approved
                - Rejected
                - DryRunPassed
                - Executing
                - Succeeded
                - Failed
                - Undone
                - Expired
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
