---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: fixes.sentinel.karimzakzouk.github.io
spec:
  group: sentinel.karimzakzouk.github.io
  names:
    categories:
    - sentinel
    kind: Fix
    listKind: FixList
    plural: fixes
    singular: fix
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workload.name
      name: Workload
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.pullRequest
      name: Pull request
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Fix is the Fixer's proposal for one incident.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              FixSpec asks the Fixer to make an incident's mitigation hold at its
              source: to propose, as a pull request to the repository the workload's
              GitOps owner deploys from, the change that undoes the blamed change. It
              cannot be changed after creation.
            properties:
              crash:
                description: |-
                  Crash is the stack the failing revision crashed with, when its logs
                  held one: a fix to the image's code starts from it.
                properties:
                  frames:
                    description: Frames are the application's own functions, innermost
                      first.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: atomic
                  language:
                    description: Language is the runtime that printed it, such as
                      go.
                    type: string
                required:
                - frames
                - language
                type: object
              faultClass:
                description: |-
                  FaultClass is the class Sentinel gave the incident. When that
                  revision changed several values, it says which of them to blame; the
                  fix leaves the others as the revision set them.
                type: string
              fromRevision:
                description: |-
                  FromRevision is the pod template hash of the revision the workload
                  was rolled back from, whose template holds the bad values.
                minLength: 1
                type: string
              incidentId:
                description: IncidentID links the fix to its incident in the Ledger.
                minLength: 1
                type: string
              memoryLimits:
                additionalProperties:
                  type: string
                description: |-
                  MemoryLimits are, per container, the memory limit Sentinel learned
                  from what the workload used while it was healthy. For a memory-limit
                  incident a fix proposes it, since putting back the old limit can be
                  as wrong as the new one.
                type: object
              merge:
                description: |-
                  Merge lets the Fixer merge its pull request itself: the namespace's
                  policy grants fix.merge at autonomous, and Sentinel's fixes for this
                  fault on this workload have earned it where the policy asks them to.
                  The Fixer checks the policy again before it merges.
                type: boolean
              workload:
                description: Workload is the workload the mitigation rolled back.
                properties:
                  apiVersion:
                    minLength: 1
                    type: string
                  kind:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                - namespace
                type: object
            required:
            - fromRevision
            - incidentId
            - workload
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: FixStatus is written by the Fixer.
            properties:
              branch:
                type: string
              change:
                description: Change says, per line changed, file:line and the change.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              code:
                description: |-
                  Code is the fix proposed to the failing image's source, beside the
                  one that pins the image back, when the fault is in its code.
                properties:
                  change:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  commit:
                    description: |-
                      Commit is the fix's commit, whose image the source's own pipeline
                      builds, and Image that image once the registry has it.
                    type: string
                  failing:
                    description: |-
                      Failing is the image that crashed; the image built from the fix is
                      looked for in its repository.
                    type: string
                  function:
                    description: Function is what the fix puts back as it was.
                    type: string
                  image:
                    type: string
                  message:
                    description: Message says why there is no code fix, or how it
                      stands.
                    type: string
                  number:
                    format: int32
                    type: integer
                  pullRequest:
                    type: string
                  repository:
                    description: |-
                      Repository is the source's URL, and Revision the commit the failing
                      image was built from.
                    type: string
                  revision:
                    type: string
                type: object
              mergeCommit:
                description: MergeCommit is the commit that merged the pull request.
                type: string
              message:
                type: string
              number:
                format: int32
                type: integer
              observedGeneration:
                format: int64
                type: integer
              owner:
                description: |-
                  Owner is what deploys the workload, as Kind namespace/name, and
                  Resume the command a person runs to resume it once the fix is in.
                type: string
              phase:
                description: |-
                  FixPhase is a step in a fix's lifecycle: Proposed once its pull request
                  is open, Merged once someone merged it, Ready once the owner's source
                  holds the merge, so a person can resume the owner, and Applied once the
                  owner is resumed and has applied it; Declined when the pull request was
                  closed unmerged, Abstained when the Fixer would not propose a change,
                  saying why.
                enum:
                - Pending
                - Proposed
                - Merged
                - Ready
                - Applied
                - Declined
                - Abstained
                - Failed
                type: string
              pullRequest:
                description: PullRequest is the pull request's URL, and Number its
                  number.
                type: string
              repository:
                description: |-
                  Repository is the clone URL of the owner's source, and Branch the
                  branch it deploys.
                type: string
              resume:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
