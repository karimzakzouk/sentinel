---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: experiments.sentinel.karimzakzouk.github.io
spec:
  group: sentinel.karimzakzouk.github.io
  names:
    categories:
    - sentinel
    kind: Experiment
    listKind: ExperimentList
    plural: experiments
    shortNames:
    - exp
    singular: experiment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.purpose
      name: Purpose
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.runs
      name: Runs
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: 'Experiment is one Lab run: reproduce a failure, or judge a fix
          against it.'
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ExperimentSpec describes one sealed Lab run. It cannot be
              changed after creation.
            properties:
              alphaPercent:
                default: 5
                description: AlphaPercent bounds the false-PASS rate of the verdict,
                  in percent.
                format: int32
                maximum: 20
                minimum: 1
                type: integer
              candidate:
                description: Candidate identifies the fix under test.
                type: string
              fakes:
                description: |-
                  Fakes lists outbound calls traffic capture saw to outside hosts,
                  which Lab stubs answer with the recorded HTTP status (metadata only).
                items:
                  description: FakeCall is one outbound call capture saw, which a
                    Lab fake answers.
                  properties:
                    host:
                      maxLength: 253
                      minLength: 1
                      type: string
                    method:
                      maxLength: 16
                      minLength: 1
                      type: string
                    path:
                      description: Path or route template, with no query string.
                      maxLength: 1024
                      pattern: ^/[^?#\s]*$
                      type: string
                    port:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    responseBody:
                      description: ResponseBody is a redacted response body sample
                        when capture.bodies kept one.
                      maxLength: 4096
                      type: string
                    status:
                      format: int32
                      maximum: 999
                      minimum: 0
                      type: integer
                  required:
                  - host
                  - method
                  - path
                  - status
                  type: object
                maxItems: 50
                type: array
              incidentId:
                description: IncidentID links the experiment to its incident in the
                  Ledger.
                minLength: 1
                type: string
              labNamespace:
                description: LabNamespace is a namespace from the pool created at
                  install.
                minLength: 1
                type: string
              maxRuns:
                default: 200
                description: MaxRuns caps the paired runs before the verdict falls
                  back to not-sure.
                format: int32
                maximum: 1000
                minimum: 1
                type: integer
              overrides:
                description: |-
                  Overrides, for verify-fix, make the candidate the failing revision
                  with these values in place: a limit learned from healthy use, raced
                  before the pull request that sets it opens.
                items:
                  description: |-
                    ValueOverride is one value a candidate sets: a container's resource
                    limit or request, as "limits.memory" or "requests.cpu".
                  properties:
                    container:
                      type: string
                    field:
                      enum:
                      - limits.memory
                      - limits.cpu
                      - limits.ephemeral-storage
                      - requests.memory
                      - requests.cpu
                      - requests.ephemeral-storage
                      type: string
                    value:
                      type: string
                  required:
                  - container
                  - field
                  - value
                  type: object
                maxItems: 20
                type: array
                x-kubernetes-list-type: atomic
              purpose:
                description: |-
                  Purpose says what the experiment tests: prove seals the Lab and
                  proves its isolation, and runs no workload.
                enum:
                - prove
                - reproduce
                - verify-fix
                - verify-config
                type: string
              replay:
                description: |-
                  Replay lists reads traffic capture saw production answer, which each
                  run sends its copy once the copy is ready: a copy works only if it
                  answers every one, without a server error unless its world's
                  datastores are throwaway and empty.
                items:
                  description: ReplayRequest is one GET a run sends its copy.
                  properties:
                    path:
                      description: Path, with no query string.
                      maxLength: 1024
                      pattern: ^/[^?#\s]*$
                      type: string
                    port:
                      description: Port the copy serves it on; its first declared
                        port when omitted.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - path
                  type: object
                maxItems: 20
                type: array
              revision:
                description: |-
                  Revision is the workload's failing revision: a Deployment's
                  ReplicaSet or a StatefulSet's ControllerRevision. Empty means its
                  current template.
                type: string
              timeout:
                default: 30m
                description: Timeout caps the experiment's wall-clock time.
                type: string
              workload:
                description: |-
                  Workload is the production workload the experiment copies into the
                  Lab, with its dependencies.
                properties:
                  apiVersion:
                    minLength: 1
                    type: string
                  kind:
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                  namespace:
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                - namespace
                type: object
              writes:
                description: |-
                  Writes lists non-GET requests traffic capture kept with bodies, which
                  each run sends its copy once the copy is ready: a copy works only if
                  it answers every one with the same status production saw, unless its
                  world's datastores are throwaway and empty.
                items:
                  description: WriteReplay is one non-GET request a run sends its
                    copy.
                  properties:
                    body:
                      description: Body is production's redacted request body when
                        capture kept one.
                      maxLength: 4096
                      type: string
                    method:
                      maxLength: 16
                      minLength: 1
                      type: string
                    path:
                      description: Path, with no query string.
                      maxLength: 1024
                      pattern: ^/[^?#\s]*$
                      type: string
                    port:
                      description: Port the copy serves it on; its first declared
                        port when omitted.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    status:
                      description: Status is the HTTP status production answered.
                      format: int32
                      maximum: 999
                      minimum: 0
                      type: integer
                  required:
                  - method
                  - path
                  - status
                  type: object
                maxItems: 20
                type: array
            required:
            - incidentId
            - labNamespace
            - purpose
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: every purpose but prove names a workload
              rule: self.purpose == 'prove' || has(self.workload)
          status:
            description: ExperimentStatus is written by the Lab.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              fidelity:
                description: Fidelity lists every way the Lab's copy differs from
                  production.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: atomic
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: ExperimentPhase is a step in an experiment's lifecycle.
                enum:
                - Pending
                - Sealing
                - Running
                - Passed
                - Failed
                - NotSure
                - Aborted
                type: string
              runs:
                description: Runs is the number of paired runs completed.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
