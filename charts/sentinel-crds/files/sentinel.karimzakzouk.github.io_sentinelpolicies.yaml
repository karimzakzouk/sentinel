metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: sentinelpolicies.sentinel.karimzakzouk.github.io
spec:
  group: sentinel.karimzakzouk.github.io
  names:
    categories:
    - sentinel
    kind: SentinelPolicy
    listKind: SentinelPolicyList
    plural: sentinelpolicies
    shortNames:
    - sp
    singular: sentinelpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SentinelPolicy opts a namespace in to Sentinel and sets how far
          it may act.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SentinelPolicySpec is a namespace owner's opt-in.
            properties:
              autonomy:
                description: Autonomy lists the highest autonomy per action type.
                  Unlisted actions stay at observe.
                items:
                  description: ActionAutonomy caps the autonomy of one action type.
                  properties:
                    action:
                      description: Action is an action type, such as rollout.undo
                        or scale.
                      maxLength: 63
                      minLength: 1
                      type: string
                    earned:
                      description: |-
                        Earned holds the action at approve, wherever Level is higher, until
                        its track record on the workload and fault class at hand clears the
                        target; a failure sends it back.
                      type: boolean
                    level:
                      description: |-
                        Level is the highest autonomy the action may reach. Track records can
                        only raise an action up to this level, never past it.
                      enum:
                      - observe
                      - recommend
                      - approve
                      - lab-verified
                      - act-unless-vetoed
                      - autonomous
                      type: string
                  required:
                  - action
                  - level
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - action
                x-kubernetes-list-type: map
              budgets:
                description: Budgets bound the risk Sentinel may take.
                properties:
                  alphaPercent:
                    default: 5
                    description: AlphaPercent is the accepted false-positive rate
                      of verification and Lab tests, in percent.
                    format: int32
                    maximum: 20
                    minimum: 1
                    type: integer
                  falseAlarmsPerWeek:
                    default: 1
                    description: FalseAlarmsPerWeek is the accepted number of false
                      alarms per service per week.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  maxCapacityRemovalPercent:
                    default: 20
                    description: MaxCapacityRemovalPercent caps the share of a workload's
                      replicas an action may take away.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                type: object
              capture:
                description: |-
                  Capture turns traffic capture on for the namespace, where its agent
                  is installed.
                properties:
                  bodies:
                    description: |-
                      Bodies is an opt-in to also keep redacted request and response bodies
                      (capped), only when Requests is on. Off by default. The body recorder
                      is not fully live yet, so this field reserves the policy switch the
                      console exposes; turning it on stores no bodies until the agent and
                      controller keep them.
                    type: boolean
                  requests:
                    description: |-
                      Requests keeps the method, route, status and timing of the requests
                      its workloads serve and make, never a header, so the Lab can replay
                      reads and stand in for what they call. Bodies stay out unless Bodies
                      is also on.
                    type: boolean
                type: object
              criticalSelector:
                description: CriticalSelector marks tier-0 workloads, which are held
                  to stricter rules.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              quietPeriodAfterHumanEdit:
                default: 30m
                description: QuietPeriodAfterHumanEdit pauses actions on a workload
                  after a person changes it.
                type: string
            type: object
          status:
            description: SentinelPolicyStatus reports whether the policy is in effect.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
