{{- /* files/ holds controller-gen output unchanged; labels and the keep policy are added here. */ -}}
{{- range $path, $_ := .Files.Glob "files/*.yaml" }}
{{- $crd := $.Files.Get $path | fromYaml }}
{{- $meta := $crd.metadata }}
{{- $_ := set $meta "annotations" (merge (dict "helm.sh/resource-policy" "keep") (default (dict) $meta.annotations)) }}
{{- $_ := set $meta "labels" (merge (include "sentinel-crds.labels" $ | fromYaml) (default (dict) $meta.labels)) }}
---
{{ toYaml $crd }}
{{- end }}
