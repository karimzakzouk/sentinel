image:
  repository: ghcr.io/karimzakzouk/sentinel
  # Defaults to the chart's appVersion.
  tag: ""
  # When set, the image is pulled by digest and tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent

# Namespaces Sentinel may watch. Required: an empty list fails the install,
# because Sentinel never guesses where it is allowed to look.
watch:
  namespaces: []

# The identity that will execute actions. It lives in its own namespace, so
# the controller, which may create (dry-run) pods in its namespace, can never
# start a pod that runs as the actor.
actor:
  enabled: false
  namespace: sentinel-actor
  serviceAccount: sentinel-actor
  # More than one runs a standby: replicas take a Lease in turn, and only
  # its holder carries out requests. The same holds for the Lab and the
  # Fixer; the controller runs one, the only writer of its Ledger.
  replicas: 1
  actions:
    # The kill switch. Nothing acts without a SentinelPolicy that allows it.
    enabled: true
    # Actions per namespace per hour, at most.
    perHour: 6

# A pool of namespaces created at install for Lab runs. Sentinel never creates
# namespaces or RBAC at runtime.
lab:
  enabled: false
  replicas: 1
  namespacePrefix: sentinel-lab-
  poolSize: 2
  # The cluster's DNS domain, which a world's copies use to name each other.
  clusterDomain: cluster.local
  # How the Lab seals its namespaces:
  #   policy    NetworkPolicy, which the cluster must be proven to enforce
  #   firewall  every Lab pod seals itself first, with a firewall from
  #             Sentinel's own image, on any network plugin
  #   auto      policy where the cluster enforces it, the firewall elsewhere
  # The firewall is one init container per Lab pod holding NET_ADMIN, so
  # with firewall or auto the Lab's namespaces enforce Pod Security's
  # privileged level, and the sentinel-fence chart (with lab.sealImage set
  # to this chart's image) holds every other container to restricted.
  # Either way the Lab proves the seal with live traffic before it runs.
  seal: auto
  # Ask the Lab whether each proposed rollback fixes its incident.
  verifyRollbacks: true
  quota:
    pods: "20"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 8Gi

# The false-alarm budget per workload per week sets every detection
# threshold. The window and tick only trade detection speed for noise.
detection:
  falseAlarmsPerWeek: 1
  window: 5m
  tick: 15s
  halfLife: 168h
  # How long an incident stays open after its signals go quiet.
  incidentGap: 5m
  # How long a workload's error rate is learned before it may alarm.
  warmUp: 30m

# Container logs fetched when a container crashes or a pod stays unready,
# and each workload's errors sampled from one ready pod, 30 fetches a minute
# at most. Only redacted summaries are kept.
logs:
  enabled: true
  # Between the tick and the window; 0s turns sampling off.
  sampleInterval: 1m

# GitOps controllers the actor may pause to roll back through, once a
# SentinelPolicy allows it (argocd.rollback, flux.rollback). Off by default;
# the sentinel-fence chart must name the same namespaces.
owners:
  argocd:
    enabled: false
    namespace: argocd
  # flux.rollback suspends the Kustomization that applies a workload.
  flux:
    enabled: false
    namespaces: [flux-system]

# The Fixer proposes, as a pull request, the change that makes a verified
# rollback through Argo CD or Flux hold in Git, and follows it until the
# owner has applied it; a person merges it and resumes the owner. It runs
# as its own identity and holds the forge token, which the controller never
# sees. Off by default; the owners above must be on for it to find sources.
fixer:
  enabled: false
  replicas: 1
  # Fixes to a failing image's code, beside the fix that pins the image back:
  # the Fixer reads images' labels from their registries, finds the commit a
  # crash's function changed in, and proposes it back as it was; the
  # source's own pipeline builds the fix. Registries reached over plain
  # HTTP, as host:port, are listed as insecure.
  code:
    enabled: false
    insecureRegistries: []
    platform: amd64
    # The fixers tried for a crash, in order, each change raced in the Lab
    # before the next is tried: restore (the crashing function put back as
    # it was), template (a fixed change at the crash's line), revert (every
    # file the culprit commit changed put back) and llm (a language
    # model's change, asked only once the others have nothing left). Leave
    # one out to turn it off.
    fixers: [restore, template, revert, llm]
    # A crash nothing was rolled back from, as a bug older than the newest
    # revision, gets a fix to its code too: the culprit is whichever commit
    # last changed the code the crash ran through.
    withoutRollback: true
    # A language model the llm fixer asks, off while url is empty. Any
    # model works through one of two request formats: openai (OpenAI,
    # Azure, Gemini, Mistral, DeepSeek, Groq, xAI, OpenRouter, Ollama,
    # vLLM, llama.cpp, LM Studio, LiteLLM) or anthropic. Its key, if it
    # needs one, is in secretName's key; maxAttempts bounds its changes per
    # fix. Its changes never merge themselves.
    llm:
      format: openai
      url: ""
      model: ""
      secretName: ""
      key: key
      maxAttempts: 2
  forge:
    # github, gitea, gitlab, bitbucket (Cloud) or bitbucket-server (Data
    # Center); empty is GitHub at api.github.com and Gitea anywhere else.
    kind: ""
    # The forge's address, which its repositories' clone URLs start with,
    # and its API's base URL:
    #   GitHub              https://github.com, https://api.github.com
    #   Gitea               its root URL, and that with /api/v1
    #   GitLab              https://gitlab.com, or a server's root URL, and that with /api/v4
    #   Bitbucket Cloud     https://bitbucket.org, https://api.bitbucket.org/2.0
    #   Bitbucket DC        its root URL, and that with /rest/api/1.0
    web: ""
    api: ""
    # A Secret in the release namespace holding the forge token, and the
    # user Git pushes as: by default sentinel, oauth2 on GitLab, and
    # x-token-auth, which Bitbucket's access tokens require. The token
    # pushes branches, opens, comments on and merges pull requests: on
    # GitHub, contents and pull requests write; on Gitea, write:repository
    # and write:issue; on GitLab, api and write_repository; on Bitbucket,
    # repository and pull request write.
    secretName: ""
    key: token
    user: ""
    # On GitHub, act as a GitHub App instead of with a token: the App's id,
    # its installation's id, and its private key under app.key in the same
    # Secret. Its tokens last an hour and reach only the repositories it is
    # installed on, with contents, pull requests and issues write.
    app:
      id: 0
      installationId: 0
      key: private-key.pem
  # The author of the Fixer's commits.
  author:
    name: Sentinel
    email: sentinel@localhost

# Traffic capture keeps, for namespaces whose SentinelPolicy turns it on
# (capture.requests), the method, route, status and timing of the requests
# their workloads serve and make, never a body or a header, so the Lab can
# replay reads to its copies. Its agent, OpenTelemetry's eBPF
# instrumentation, runs on every node, in a namespace of its own that allows
# the capabilities eBPF needs. Off by default; where nodes cannot run it,
# the capability report says so and Sentinel works without it.
capture:
  enabled: false
  namespace: sentinel-capture
  image: otel/ebpf-instrument:v1.0.0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# The console signs people in with their own Kubernetes token. Where the
# cluster's API server trusts an OIDC identity provider, it signs them in
# there too: name the provider's issuer and the client the API server
# accepts ID tokens for, and register the redirect URL, the console's
# address as people open it, with the provider.
console:
  oidc:
    issuer: ""
    clientID: ""
    # A Secret in the release namespace holding the client's secret, if
    # the provider gives it one.
    clientSecret:
      secretName: ""
      key: client-secret
    redirectURL: http://localhost:8090/api/session/oidc/callback
    scopes: [email, groups]

# Where Sentinel tells people what it needs from them or did: approvals,
# escalations, and actions that cleared an incident. Name a Secret holding a
# Slack incoming webhook URL; without one, notices stay in the UI.
notify:
  slack:
    secretName: ""
    key: webhook-url

capabilities:
  interval: 10m
  # Dry-run probes create no objects. The sentinel-fence chart enforces that
  # the controller's pod creates are dry runs.
  dryRunProbes: true

ledger:
  storage:
    size: 1Gi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""

# debug, info, warn or error. debug also logs every detector evaluation that
# had facts in its window: count, tail probability, threshold, episode state.
logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
