apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "sentinel.config" . | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-ledger
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
  annotations:
    # The Ledger is the audit trail; uninstalling Sentinel must not delete it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.ledger.storage.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ledger.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  # One writer per ledger file; high availability comes with leader election.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "sentinel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sentinel.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "sentinel.config" . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: sentinel
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ include "sentinel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [run, --config, /etc/sentinel/config.yaml]
          env:
            - name: SENTINEL_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.notify.slack.secretName }}
            - name: SENTINEL_SLACK_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.notify.slack.key }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
            {{- if .Values.capture.enabled }}
            - name: capture
              containerPort: 4318
            {{- end }}
            {{- if .Values.nodeAgent.enabled }}
            - name: node-agent
              containerPort: 4319
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/sentinel
              readOnly: true
            - name: ledger
              mountPath: /var/lib/sentinel
            - name: tmp
              mountPath: /tmp
            {{- if .Values.capture.enabled }}
            - name: capture-token
              mountPath: /etc/sentinel-capture
              readOnly: true
            {{- end }}
            {{- if .Values.nodeAgent.enabled }}
            - name: node-agent-token
              mountPath: /etc/sentinel-node-agent
              readOnly: true
            {{- end }}
            {{- if .Values.console.oidc.clientSecret.secretName }}
            - name: oidc
              mountPath: /etc/sentinel-oidc
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: sentinel-config
        - name: ledger
          persistentVolumeClaim:
            claimName: sentinel-ledger
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.capture.enabled }}
        - name: capture-token
          secret:
            secretName: sentinel-capture-token
        {{- end }}
        {{- if .Values.nodeAgent.enabled }}
        - name: node-agent-token
          secret:
            secretName: sentinel-node-agent-token
        {{- end }}
        {{- with .Values.console.oidc.clientSecret.secretName }}
        - name: oidc
          secret:
            secretName: {{ . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# The controller only talks to the API server and DNS, and only kubelet
# health checks, traffic capture's agent and the node agent reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sentinel.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8081
    {{- if .Values.capture.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.capture.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinel-capture
      ports:
        - port: 4318
    {{- end }}
    {{- if .Values.nodeAgent.enabled }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.nodeAgent.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: sentinel-node-agent
      ports:
        - port: 4319
    {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
        - port: 6443
