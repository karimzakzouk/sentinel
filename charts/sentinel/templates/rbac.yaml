{{- $labels := include "sentinel.labels" . }}
{{- $controller := dict "kind" "ServiceAccount" "name" "sentinel" "namespace" .Release.Namespace }}
# Read-only access to workloads. Secrets, exec and nodes/proxy are deliberately absent.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-watch
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, events, configmaps, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [sentinelpolicies]
    verbs: [get, list, watch]
  {{- if .Values.actor.enabled }}
  # Asking the actor for an action is the controller's only write; the fence
  # holds it to the watched namespaces.
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [actionrequests]
    verbs: [get, list, watch, create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-cluster-read
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [list]
  {{- if .Values.actor.enabled }}
  # Lets the capability report check what the actor may do.
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-cluster-read
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-cluster-read
subjects:
  - {{ toJson $controller }}
{{- range .Values.watch.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-watch
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-watch
subjects:
  - {{ toJson $controller }}
{{- end }}
{{- if .Values.capabilities.dryRunProbes }}
{{- range concat (list .Release.Namespace) (include "sentinel.labNamespaces" . | fromJsonArray) }}
---
# Pod creates are for dry-run probes only; sentinel-fence rejects real ones.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-probe
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-probe
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-probe
subjects:
  - {{ toJson $controller }}
{{- end }}
{{- end }}
{{- if .Values.actor.enabled }}
---
# Update existing workloads and their scale, read the revisions a rollback
# restores, and carry out action requests; never create, delete or read
# Secrets. The fence bounds every write.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-act
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, deployments/scale, statefulsets/scale]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [actionrequests, sentinelpolicies]
    verbs: [get, list, watch]
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [actionrequests/status]
    verbs: [update]
{{- range .Values.watch.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-act
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-act
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.actor.serviceAccount }}
    namespace: {{ $.Values.actor.namespace }}
{{- end }}
{{- end }}
{{- if and .Values.actor.enabled .Values.owners.argocd.enabled }}
---
# Pausing an Argo CD Application's automated sync before a rollback; the
# fence allows that change and no other.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-act-argocd
  namespace: {{ .Values.owners.argocd.namespace }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, patch]
  # To tell whether an ApplicationSet would restore a paused sync.
  - apiGroups: [argoproj.io]
    resources: [applicationsets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-act-argocd
  namespace: {{ .Values.owners.argocd.namespace }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-act-argocd
subjects:
  - kind: ServiceAccount
    name: {{ .Values.actor.serviceAccount }}
    namespace: {{ .Values.actor.namespace }}
{{- end }}
{{- if and .Values.actor.enabled .Values.owners.flux.enabled }}
{{- range .Values.owners.flux.namespaces }}
---
# Suspending the Flux Kustomization or HelmRelease that applies a workload
# before a rollback; the fence allows that change and no other.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $.Release.Name }}-act-flux
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [get, patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-act-flux
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-act-flux
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.actor.serviceAccount }}
    namespace: {{ $.Values.actor.namespace }}
{{- end }}
{{- end }}
{{- if .Values.lab.enabled }}
---
# Asking the Lab to verify a rollback: the controller creates Experiments in
# the Lab's pool and reads their verdicts; the fence holds it to that.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-lab-ask
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [experiments]
    verbs: [get, list, watch, create]
{{- if .Values.actor.enabled }}
---
# Reading the Lab's verdicts: at lab-verified the actor checks the
# Experiment a request names before it acts.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-lab-read
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [experiments]
    verbs: [get]
{{- end }}
{{- range include "sentinel.labNamespaces" . | fromJsonArray }}
{{- if $.Values.actor.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-lab-read
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-lab-read
subjects:
  - {"kind": "ServiceAccount", "name": {{ $.Values.actor.serviceAccount | quote }}, "namespace": {{ $.Values.actor.namespace | quote }}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-lab-ask
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-lab-ask
subjects:
  - {{ toJson $controller }}
{{- end }}
{{- end }}
{{- if .Values.fixer.enabled }}
---
# Asking the Fixer for a fix: the controller creates Fixes in its own
# namespace and reads how they went; the fence holds it to that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-fix-ask
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [fixes]
    verbs: [get, list, watch, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-fix-ask
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-fix-ask
subjects:
  - {{ toJson $controller }}
{{- end }}
