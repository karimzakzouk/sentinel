{{- if .Values.lab.enabled }}
{{- $labels := include "sentinel.labels" . }}
{{- $pool := include "sentinel.labNamespaces" . | fromJsonArray }}
{{- $lab := dict "kind" "ServiceAccount" "name" "sentinel-lab" "namespace" .Release.Namespace }}
# The Lab seals a namespace from its pool and proves the seal with live
# traffic before an experiment runs there. It acts as its own identity; the
# sentinel-fence chart bounds its writes to the pool and its pods to the
# probe image.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-lab
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel-lab-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
data:
  config.yaml: |
    pool: {{ toJson $pool }}
    twins: {{ toJson .Values.watch.namespaces }}
    clusterDomain: {{ .Values.lab.clusterDomain }}
    healthAddr: ":8081"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-lab
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: lab
spec:
  # One Lab runs experiments one at a time.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-lab
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-lab
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: sentinel-lab
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lab
          image: {{ include "sentinel.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [lab, --config, /etc/sentinel-lab/config.yaml]
          ports:
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/sentinel-lab
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: sentinel-lab-config
---
# The Lab only talks to the API server and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-lab
  namespace: {{ .Release.Namespace }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sentinel-lab
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8081
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
        - port: 6443
---
# The matrix's destinations: every node's address, the API server's and
# cluster DNS's Services and endpoints, and the watched namespaces' Services
# and pods, read only where those live.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-lab-nodes
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-lab-nodes
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-lab-nodes
subjects:
  - {{ toJson $lab }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-lab-matrix
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
{{- range list "default" "kube-system" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-lab-matrix
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-lab-matrix
subjects:
  - {{ toJson $lab }}
{{- end }}
---
# What the Lab copies from a watched namespace, and probes there: workloads
# and their revisions, Services, ConfigMaps and pods. Never Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-lab-twin
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [services, pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list]
  - apiGroups: [apps]
    resources: [replicasets, controllerrevisions]
    verbs: [get]
{{- range .Values.watch.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-lab-twin
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-lab-twin
subjects:
  - {{ toJson $lab }}
{{- end }}
---
# Running experiments: probe pods, worlds and their DNS, the seal's policy,
# and the experiments' status, in the pool only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-lab-run
  labels:
    {{- $labels | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete, deletecollection]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, create, delete, deletecollection]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, delete]
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [experiments]
    verbs: [get, list, watch]
  - apiGroups: [sentinel.karimzakzouk.github.io]
    resources: [experiments/status]
    verbs: [update]
{{- range $pool }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-lab-run
  namespace: {{ . }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-lab-run
subjects:
  - {{ toJson $lab }}
{{- end }}
{{- end }}
