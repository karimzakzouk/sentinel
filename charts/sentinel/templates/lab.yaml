{{- range (include "sentinel.labNamespaces" . | fromJsonArray) }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ . }}
  labels:
    {{- include "sentinel.labels" $ | nindent 4 }}
    app.kubernetes.io/component: lab
    pod-security.kubernetes.io/enforce: restricted
---
# Nothing gets in or out unless a Lab experiment adds a narrower allow rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ . }}
  labels:
    {{- include "sentinel.labels" $ | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: lab
  namespace: {{ . }}
  labels:
    {{- include "sentinel.labels" $ | nindent 4 }}
spec:
  hard:
    {{- toYaml $.Values.lab.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab
  namespace: {{ . }}
  labels:
    {{- include "sentinel.labels" $ | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
{{- end }}
