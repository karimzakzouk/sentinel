{{- include "sentinel.validate" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.actor.enabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.actor.namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.actor.serviceAccount }}
  namespace: {{ .Values.actor.namespace }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
