# Install this chart as a cluster admin. Sentinel's own identities cannot
# change admission policies, so they cannot lift the fence.

# Sentinel's controller identity: may only run dry-run pod probes and access
# reviews; every other write is rejected.
controller:
  namespace: sentinel
  serviceAccount: sentinel

# The identity that executes actions.
actor:
  namespace: sentinel-actor
  serviceAccount: sentinel-actor

# Namespaces the actor may change. Keep in sync with the sentinel chart's
# watch.namespaces. Empty means the actor may change nothing.
namespaces: []

replicas:
  min: 1
  max: 20

# Where Argo CD keeps its Applications, if the actor may pause them before a
# rollback; empty means it may not.
argocdNamespace: ""

# Where Flux keeps the Kustomizations the actor may suspend before a
# rollback; empty means it may not.
fluxNamespaces: []

# The Fixer's identity, which may only report on Fixes in its namespace:
# its changes go to Git as pull requests, never to the cluster.
fixer:
  namespace: sentinel
  serviceAccount: sentinel-fixer

# The Lab's identity and its pool of namespaces; empty means the Lab may
# change nothing.
lab:
  namespace: sentinel
  serviceAccount: sentinel-lab
  pool: []
  # The image of the firewall each Lab pod seals itself with where the
  # cluster does not enforce NetworkPolicy: the sentinel chart's own image,
  # exactly as it runs it. Only an init container named lab-seal, first in
  # its pod, from this image and running its seal command, may hold
  # NET_ADMIN; empty forbids the firewall.
  sealImage: ""
