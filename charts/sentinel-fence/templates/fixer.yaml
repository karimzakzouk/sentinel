# The Fixer's changes go to Git as pull requests, which people merge; in the
# cluster it may only report how a Fix went, in its own namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-fixer
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["*/*"]
  matchConditions:
    - name: is-sentinel-fixer
      expression: request.userInfo.username == "system:serviceaccount:{{ include "fence.fixerNamespace" . }}:{{ .Values.fixer.serviceAccount }}"
    # The Lease replicas take in turn, so that one acts at a time, is the
    # only object outside these rules it may write.
    - name: not-its-lease
      expression: >-
        !(request.resource.group == 'coordination.k8s.io' && request.resource.resource == 'leases' &&
          request.namespace == '{{ include "fence.fixerNamespace" . }}' && request.name == 'sentinel-fixer')
  variables:
    {{- include "fence.requestVariables" . | nindent 4 }}
  validations:
    - expression: >-
        request.resource.group == 'sentinel.karimzakzouk.github.io' && request.resource.resource == 'fixes' &&
        variables.subResource == 'status' && request.operation == 'UPDATE' && variables.requestNamespace == '{{ include "fence.fixerNamespace" . }}'
      message: "Sentinel's Fixer may only report on Fixes; it never changes the cluster"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-fixer
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-fixer
  validationActions: [Deny]
