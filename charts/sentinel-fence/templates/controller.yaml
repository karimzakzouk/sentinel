apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-controller
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["*/*"]
  matchConditions:
    - name: is-sentinel-controller
      expression: request.userInfo.username == "{{ include "fence.controllerUser" . }}"
  variables:
    {{- include "fence.requestVariables" . | nindent 4 }}
  validations:
    - expression: >-
        request.resource.group in ['authorization.k8s.io', 'authentication.k8s.io'] ||
        (request.resource.group == '' && request.resource.resource == 'configmaps' && variables.subResource == '' &&
         request.operation in ['CREATE', 'UPDATE', 'DELETE'] &&
         ((variables.requestNamespace == '{{ include "fence.controllerNamespace" . }}' &&
           request.name in ['sentinel-config', 'sentinel-fixer-config', 'sentinel-lab-config']) ||
          (variables.requestNamespace == '{{ .Values.actor.namespace }}' && request.name == 'sentinel-actor-config') ||
          (variables.requestNamespace == 'sentinel-capture' &&
           request.name in ['sentinel-capture', 'sentinel-capture-mitm-runtime']))) ||
          (request.resource.group == 'sentinel.karimzakzouk.github.io' && request.resource.resource == 'sentinelsettings' &&
           variables.subResource == 'status' && variables.requestNamespace == '{{ include "fence.controllerNamespace" . }}' &&
           request.operation == 'UPDATE') ||
        (request.resource.group == 'apps' && request.resource.resource == 'deployments' && variables.subResource == '' &&
         request.operation in ['UPDATE', 'DELETE'] &&
         ((variables.requestNamespace == '{{ include "fence.controllerNamespace" . }}' &&
           request.name in ['sentinel', 'sentinel-fixer', 'sentinel-lab']) ||
          (variables.requestNamespace == '{{ .Values.actor.namespace }}' && request.name == 'sentinel-actor'))) ||
        (request.resource.resource == 'pods' && variables.subResource == '' && request.operation == 'CREATE' && variables.dryRun) ||
        (request.resource.resource == 'namespaces' && request.operation == 'UPDATE' && variables.subResource == '') ||
        (request.resource.group == 'rbac.authorization.k8s.io' && request.resource.resource == 'rolebindings' &&
         request.operation in ['CREATE', 'UPDATE', 'DELETE'] && variables.subResource == '') ||
        (request.resource.group == 'sentinel.karimzakzouk.github.io' && request.resource.resource == 'actionrequests' &&
         variables.subResource == '' && request.operation == 'CREATE' && variables.requestNamespace != '' &&
         namespaceObject != null &&
         namespaceObject.metadata.?labels['sentinel.karimzakzouk.github.io/watched'].orValue('') == 'true') ||
        (request.resource.group == 'sentinel.karimzakzouk.github.io' && request.resource.resource == 'experiments' &&
         variables.subResource == '' && request.operation == 'CREATE' && variables.requestNamespace in {{ include "fence.labPoolCEL" . }} &&
         object.spec.purpose in ['verify-fix', 'reproduce'] && object.spec.labNamespace == variables.requestNamespace) ||
        (request.resource.group == 'sentinel.karimzakzouk.github.io' && request.resource.resource == 'fixes' &&
         variables.subResource == '' && request.operation == 'CREATE' && variables.requestNamespace == '{{ include "fence.fixerNamespace" . }}')
      message: "Sentinel's controller may only dry-run probe, sync watch RBAC/labels, ask the actor/Lab/Fixer; it never changes workloads directly"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-controller
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-controller
  validationActions: [Deny]
