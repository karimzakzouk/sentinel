# Every write by the Lab: probe pods, worlds copied from production and
# their DNS, the seal's policies and experiments' status, in the Lab's pool
# only. Its pods may run production's images, but carry no service-account
# token and mount nothing but empty directories, ConfigMaps and the pod's
# own metadata; its policies may only name pods of the same namespace, so
# the Lab cannot open its own seal, which is what contains a copy's code.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-lab
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["*/*"]
  matchConditions:
    - name: is-sentinel-lab
      expression: request.userInfo.username == "system:serviceaccount:{{ .Values.lab.namespace }}:{{ .Values.lab.serviceAccount }}"
    # The Lease replicas take in turn, so that one acts at a time, is the
    # only object outside these rules it may write.
    - name: not-its-lease
      expression: >-
        !(request.resource.group == 'coordination.k8s.io' && request.resource.resource == 'leases' &&
          request.namespace == '{{ .Values.lab.namespace }}' && request.name == 'sentinel-lab')
  variables:
    {{- include "fence.requestVariables" . | nindent 4 }}
    - name: kind
      expression: "request.resource.group + '/' + request.resource.resource + (variables.subResource == '' ? '' : '/' + variables.subResource)"
  validations:
    - expression: "variables.requestNamespace in {{ toJson .Values.lab.pool | replace "\"" "'" }}"
      message: "the Lab may act only in its pool of namespaces"
      reason: Forbidden
    - expression: >-
        variables.kind in ['/pods', '/services', '/configmaps', 'networking.k8s.io/networkpolicies', 'sentinel.karimzakzouk.github.io/experiments/status']
      message: "the Lab may only manage its pods, services and ConfigMaps, the seal's policies and experiments' status"
      reason: Forbidden
    - expression: >-
        variables.kind != '/pods' || request.operation == 'DELETE' ||
        (object.spec.?automountServiceAccountToken.orValue(true) == false &&
         object.spec.?volumes.orValue([]).all(v, has(v.emptyDir) || has(v.configMap) || has(v.downwardAPI) ||
           (has(v.projected) && v.projected.sources.all(p, has(p.configMap) || has(p.downwardAPI)))))
      message: "the Lab's pods carry no service-account token and mount only empty directories, ConfigMaps and their own metadata"
      reason: Forbidden
    # Where each pod seals itself, the Lab's namespaces must allow the
    # firewall's NET_ADMIN, so Pod Security's restricted level is held here
    # for every other container.
    - expression: >-
        variables.kind != '/pods' || request.operation == 'DELETE' ||
        (!object.spec.?hostNetwork.orValue(false) && !object.spec.?hostPID.orValue(false) && !object.spec.?hostIPC.orValue(false) &&
         object.spec.?securityContext.?sysctls.orValue([]).size() == 0 &&
         object.spec.containers.all(c, {{ include "fence.labRestricted" . | replace "\n" " " }}) &&
         object.spec.?initContainers.orValue([]).all(c, {{ include "fence.labRestricted" . | replace "\n" " " }}))
      message: "every container of a Lab pod but its firewall meets Pod Security's restricted level, and shares nothing with the node"
      reason: Forbidden
    - expression: >-
        variables.kind != '/pods' || request.operation == 'DELETE' ||
        (object.spec.containers.all(c, c.name != 'lab-seal') &&
         object.spec.?initContainers.orValue([]).all(c, c.name != 'lab-seal' || (
           '{{ .Values.lab.sealImage }}' != '' && c.image == '{{ .Values.lab.sealImage }}' &&
           c.?command.orValue([]) == ['/sentinel'] &&
           c.?args.orValue([]).size() > 0 && c.args[0] == 'lab-seal' &&
           c.args.all(a, a == 'lab-seal' || a.startsWith('--allow=')) &&
           c.?securityContext.?capabilities.?add.orValue([]) == ['NET_ADMIN'] &&
           c.?securityContext.?capabilities.?drop.orValue([]).exists(d, d == 'ALL') &&
           !c.?securityContext.?privileged.orValue(false) &&
           c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false &&
           c.?securityContext.?readOnlyRootFilesystem.orValue(false) == true &&
           c.?volumeMounts.orValue([]).size() == 0)) &&
         (object.spec.?initContainers.orValue([]).all(c, c.name != 'lab-seal') || object.spec.initContainers[0].name == 'lab-seal'))
      message: "only a Lab pod's first init container, lab-seal, may hold NET_ADMIN, running the seal from Sentinel's own image"
      reason: Forbidden
    - expression: >-
        variables.kind != 'networking.k8s.io/networkpolicies' || request.operation == 'DELETE' ||
        (object.spec.?egress.orValue([]).all(r, r.?to.orValue([]).all(p, !has(p.ipBlock) && !has(p.namespaceSelector))) &&
         object.spec.?ingress.orValue([]).all(r, r.?from.orValue([]).all(p, !has(p.ipBlock) && !has(p.namespaceSelector))))
      message: "the Lab's policies may only name pods of the same namespace"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-lab
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-lab
  validationActions: [Deny]
