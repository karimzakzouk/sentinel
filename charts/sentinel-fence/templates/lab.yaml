# Every write by the Lab: probe pods, the echo service, the seal's policies
# and experiments' status, in the Lab's pool only. Its pods carry no
# service-account token, mount nothing but empty directories and run only
# the probe image; its policies may only name pods of the same namespace,
# so the Lab cannot open its own seal.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-lab
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["*/*"]
  matchConditions:
    - name: is-sentinel-lab
      expression: request.userInfo.username == "system:serviceaccount:{{ .Values.lab.namespace }}:{{ .Values.lab.serviceAccount }}"
  variables:
    {{- include "fence.requestVariables" . | nindent 4 }}
    - name: kind
      expression: "request.resource.group + '/' + request.resource.resource + (variables.subResource == '' ? '' : '/' + variables.subResource)"
  validations:
    - expression: "variables.requestNamespace in {{ toJson .Values.lab.pool | replace "\"" "'" }}"
      message: "the Lab may act only in its pool of namespaces"
      reason: Forbidden
    - expression: >-
        variables.kind in ['/pods', '/services', 'networking.k8s.io/networkpolicies', 'sentinel.karimzakzouk.github.io/experiments/status']
      message: "the Lab may only manage probe pods, services, the seal's policies and experiments' status"
      reason: Forbidden
    - expression: >-
        variables.kind != '/pods' || request.operation == 'DELETE' ||
        (object.spec.?automountServiceAccountToken.orValue(true) == false &&
         object.spec.containers.all(c, c.image == '{{ .Values.lab.probeImage | default "registry.k8s.io/e2e-test-images/agnhost:2.61" }}') &&
         !has(object.spec.initContainers) &&
         object.spec.?volumes.orValue([]).all(v, has(v.emptyDir)))
      message: "the Lab's pods run only the probe image, without a service-account token or volumes other than empty directories"
      reason: Forbidden
    - expression: >-
        variables.kind != 'networking.k8s.io/networkpolicies' || request.operation == 'DELETE' ||
        (object.spec.?egress.orValue([]).all(r, r.?to.orValue([]).all(p, !has(p.ipBlock) && !has(p.namespaceSelector))) &&
         object.spec.?ingress.orValue([]).all(r, r.?from.orValue([]).all(p, !has(p.ipBlock) && !has(p.namespaceSelector))))
      message: "the Lab's policies may only name pods of the same namespace"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-lab
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-lab
  validationActions: [Deny]
