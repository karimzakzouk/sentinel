{{- if .Values.argocdNamespace }}
# Before a rollback through Argo CD, the actor pauses the Application's
# automated sync and notes what it was. It may make that change and no
# other: not the source, the destination or the project, and no sync.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-actor-argocd
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [applications]
  matchConditions:
    - name: is-sentinel-actor
      expression: request.userInfo.username == "{{ include "fence.actorUser" . }}"
  variables:
    - name: newObjectAnnotations
      expression: "object.metadata.?annotations.orValue({})"
    - name: oldObjectAnnotations
      expression: "oldObject.metadata.?annotations.orValue({})"
  validations:
    - expression: >-
        object.spec.?project == oldObject.spec.?project && object.spec.?source == oldObject.spec.?source &&
        object.spec.?sources == oldObject.spec.?sources && object.spec.?destination == oldObject.spec.?destination &&
        object.spec.?ignoreDifferences == oldObject.spec.?ignoreDifferences && object.spec.?info == oldObject.spec.?info &&
        object.spec.?revisionHistoryLimit == oldObject.spec.?revisionHistoryLimit &&
        object.spec.?syncPolicy.?syncOptions == oldObject.spec.?syncPolicy.?syncOptions &&
        object.spec.?syncPolicy.?retry == oldObject.spec.?syncPolicy.?retry &&
        object.?operation == oldObject.?operation
      message: "Sentinel may only pause an Application's automated sync"
      reason: Forbidden
    - expression: "!has(object.spec.syncPolicy) || !has(object.spec.syncPolicy.automated)"
      message: "Sentinel may remove an Application's automated sync, never set it"
      reason: Forbidden
    - expression: "object.metadata.?labels == oldObject.metadata.?labels"
      message: "Sentinel may not change an Application's labels"
      reason: Forbidden
    - expression: >-
        variables.newObjectAnnotations.all(k, k.startsWith('sentinel.karimzakzouk.github.io/') || (k in variables.oldObjectAnnotations && variables.oldObjectAnnotations[k] == variables.newObjectAnnotations[k])) &&
        variables.oldObjectAnnotations.all(k, k.startsWith('sentinel.karimzakzouk.github.io/') || k in variables.newObjectAnnotations)
      message: "Sentinel may only change its own annotations on an Application"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-actor-argocd
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-actor-argocd
  validationActions: [Deny]
{{- end }}
