# Every write by the actor: only updates of existing Deployments and
# StatefulSets (or their scale), and of action requests' status, in
# allowlisted namespaces; and of the GitOps objects that sync them, which
# argocd.yaml and flux.yaml bound to a pause.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-actor
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["*/*"]
  matchConditions:
    - name: is-sentinel-actor
      expression: request.userInfo.username == "{{ include "fence.actorUser" . }}"
    # The Lease replicas take in turn, so that one acts at a time, is the
    # only object outside these rules it may write.
    - name: not-its-lease
      expression: >-
        !(request.resource.group == 'coordination.k8s.io' && request.resource.resource == 'leases' &&
          request.namespace == '{{ .Values.actor.namespace }}' && request.name == 'sentinel-actor')
  variables:
    {{- include "fence.requestVariables" . | nindent 4 }}
    - name: workload
      expression: "request.resource.group == 'apps' && request.resource.resource in ['deployments', 'statefulsets', 'daemonsets']"
    - name: argoApplication
      expression: "request.resource.group == 'argoproj.io' && request.resource.resource == 'applications'"
    - name: argoRollout
      expression: "request.resource.group == 'argoproj.io' && request.resource.resource == 'rollouts'"
    - name: flaggerCanary
      expression: "request.resource.group == 'flagger.app' && request.resource.resource == 'canaries'"
    - name: fluxSync
      expression: >-
        (request.resource.group == 'kustomize.toolkit.fluxcd.io' && request.resource.resource == 'kustomizations') ||
        (request.resource.group == 'helm.toolkit.fluxcd.io' && request.resource.resource == 'helmreleases')
  validations:
    - expression: >-
        request.resource.group in ['authorization.k8s.io', 'authentication.k8s.io'] ||
        variables.requestNamespace in {{ include "fence.namespaces" . }}{{ if .Values.argocdNamespace }} ||
        (variables.argoApplication && variables.requestNamespace == '{{ .Values.argocdNamespace }}'){{ end }}{{ if .Values.fluxNamespaces }} ||
        (variables.fluxSync && variables.requestNamespace in {{ toJson .Values.fluxNamespaces | replace "\"" "'" }}){{ end }}
      message: "Sentinel may act only in its allowlisted namespaces"
      reason: Forbidden
    - expression: >-
        request.resource.group in ['authorization.k8s.io', 'authentication.k8s.io'] ||
        (request.operation == 'UPDATE' && variables.workload && variables.subResource in ['', 'scale']) ||
        (request.operation == 'UPDATE' && variables.argoRollout && variables.subResource in ['', 'status']) ||
        (request.operation == 'UPDATE' && variables.flaggerCanary && variables.subResource in ['', 'status']) ||
        (request.operation == 'UPDATE' && request.resource.group == 'sentinel.karimzakzouk.github.io' &&
         request.resource.resource == 'actionrequests' && variables.subResource == 'status'){{ if .Values.argocdNamespace }} ||
        (request.operation == 'UPDATE' && variables.argoApplication && variables.subResource == ''){{ end }}{{ if .Values.fluxNamespaces }} ||
        (request.operation == 'UPDATE' && variables.fluxSync && variables.subResource == ''){{ end }}
      message: "Sentinel may only update existing Deployments, StatefulSets and DaemonSets, or their scale, abort Argo Rollouts or Flagger Canaries, and the status of action requests"
      reason: Forbidden
    - expression: "variables.subResource != 'scale' || (object.spec.?replicas.orValue(0) >= {{ .Values.replicas.min }} && object.spec.?replicas.orValue(0) <= {{ .Values.replicas.max }})"
      message: "replicas must stay between {{ .Values.replicas.min }} and {{ .Values.replicas.max }}"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-actor
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-actor
  validationActions: [Deny]
---
# Argo Rollouts: the actor may only set status.abort (and its companion
# abortedAt), so a progressive delivery stops and the previous ReplicaSet
# becomes active; the Rollout's template and strategy stay fixed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-actor-rollouts
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [rollouts, rollouts/status]
  matchConditions:
    - name: is-sentinel-actor
      expression: request.userInfo.username == "{{ include "fence.actorUser" . }}"
  validations:
    - expression: "object.spec == oldObject.spec"
      message: "Sentinel may not change an Argo Rollout's spec"
      reason: Forbidden
    - expression: "object.metadata.?labels == oldObject.metadata.?labels"
      message: "Sentinel may not change an Argo Rollout's labels"
      reason: Forbidden
    - expression: "object.metadata.?annotations == oldObject.metadata.?annotations"
      message: "Sentinel may not change an Argo Rollout's annotations"
      reason: Forbidden
    - expression: "object.status.?abort.orValue(false) == true"
      message: "Sentinel may abort an Argo Rollout, never clear its abort"
      reason: Forbidden
    - expression: >-
        object.status.?blueGreen == oldObject.status.?blueGreen &&
        object.status.?canary == oldObject.status.?canary &&
        object.status.?currentPodHash == oldObject.status.?currentPodHash &&
        object.status.?currentStepHash == oldObject.status.?currentStepHash &&
        object.status.?currentStepIndex == oldObject.status.?currentStepIndex &&
        object.status.?pauseConditions == oldObject.status.?pauseConditions &&
        object.status.?controllerPause == oldObject.status.?controllerPause &&
        object.status.?replicas == oldObject.status.?replicas &&
        object.status.?updatedReplicas == oldObject.status.?updatedReplicas &&
        object.status.?readyReplicas == oldObject.status.?readyReplicas &&
        object.status.?availableReplicas == oldObject.status.?availableReplicas &&
        object.status.?collisionCount == oldObject.status.?collisionCount &&
        object.status.?conditions == oldObject.status.?conditions &&
        object.status.?observedGeneration == oldObject.status.?observedGeneration &&
        object.status.?selector == oldObject.status.?selector &&
        object.status.?stableRS == oldObject.status.?stableRS &&
        object.status.?phase == oldObject.status.?phase &&
        object.status.?message == oldObject.status.?message
      message: "Sentinel may only set an Argo Rollout's abort status"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-actor-rollouts
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-actor-rollouts
  validationActions: [Deny]
---
# Flagger Canaries: the actor may only set status.phase to Failed so Flagger
# rolls the primary back; the Canary's spec and other metadata stay fixed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-actor-canaries
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [flagger.app]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [canaries, canaries/status]
  matchConditions:
    - name: is-sentinel-actor
      expression: request.userInfo.username == "{{ include "fence.actorUser" . }}"
  validations:
    - expression: "object.spec == oldObject.spec"
      message: "Sentinel may not change a Flagger Canary's spec"
      reason: Forbidden
    - expression: "object.metadata.?labels == oldObject.metadata.?labels"
      message: "Sentinel may not change a Flagger Canary's labels"
      reason: Forbidden
    - expression: "object.metadata.?annotations == oldObject.metadata.?annotations"
      message: "Sentinel may not change a Flagger Canary's annotations"
      reason: Forbidden
    - expression: "object.status.phase == 'Failed'"
      message: "Sentinel may only fail a Flagger Canary's analysis (status.phase Failed)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-actor-canaries
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-actor-canaries
  validationActions: [Deny]
---
# Deployment updates: replicas within bounds, and the pod template, which a
# rollback restores from the Deployment's own ReplicaSets. The actor copies
# templates only from there; no admission policy can tell that a template
# ran before (decision 40). The rest of the object must not change.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-actor-deployments
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [deployments]
  matchConditions:
    - name: is-sentinel-actor
      expression: request.userInfo.username == "{{ include "fence.actorUser" . }}"
  variables:
    {{- include "fence.workloadVariables" . | nindent 4 }}
  validations:
    {{- include "fence.workloadValidations" . | nindent 4 }}
    - expression: >-
        object.spec.?strategy == oldObject.spec.?strategy &&
        object.spec.?minReadySeconds == oldObject.spec.?minReadySeconds &&
        object.spec.?revisionHistoryLimit == oldObject.spec.?revisionHistoryLimit &&
        object.spec.?progressDeadlineSeconds == oldObject.spec.?progressDeadlineSeconds &&
        object.spec.?paused == oldObject.spec.?paused
      message: "Sentinel may not change a Deployment's rollout settings"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-actor-deployments
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-actor-deployments
  validationActions: [Deny]
---
# StatefulSet and DaemonSet updates: the pod template, which a rollback
# restores from the workload's own ControllerRevisions; a StatefulSet's
# rollback waits for a person in the actor's code, which no admission
# policy can check. Identity, storage and rollout settings stay fixed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-actor-statefulsets
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [statefulsets]
  matchConditions:
    - name: is-sentinel-actor
      expression: request.userInfo.username == "{{ include "fence.actorUser" . }}"
  variables:
    {{- include "fence.workloadVariables" . | nindent 4 }}
  validations:
    {{- include "fence.workloadValidations" . | nindent 4 }}
    - expression: >-
        object.spec.serviceName == oldObject.spec.serviceName &&
        object.spec.?podManagementPolicy == oldObject.spec.?podManagementPolicy &&
        object.spec.?updateStrategy == oldObject.spec.?updateStrategy &&
        object.spec.?revisionHistoryLimit == oldObject.spec.?revisionHistoryLimit &&
        object.spec.?minReadySeconds == oldObject.spec.?minReadySeconds &&
        object.spec.?volumeClaimTemplates == oldObject.spec.?volumeClaimTemplates &&
        object.spec.?persistentVolumeClaimRetentionPolicy == oldObject.spec.?persistentVolumeClaimRetentionPolicy
      message: "Sentinel may not change a StatefulSet's identity, storage or rollout settings"
    - expression: "object.spec.template.metadata.?labels == oldObject.spec.template.metadata.?labels"
      message: "Sentinel may not change a StatefulSet's pod labels, which its selector and its pods' identity rest on"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-actor-statefulsets
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-actor-statefulsets
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sentinel-fence-actor-daemonsets
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [UPDATE]
        resources: [daemonsets]
  matchConditions:
    - name: is-sentinel-actor
      expression: request.userInfo.username == "{{ include "fence.actorUser" . }}"
  variables:
    {{- include "fence.workloadVariables" . | nindent 4 }}
  validations:
    {{- include "fence.workloadValidations" . | nindent 4 }}
    - expression: >-
        object.spec.?updateStrategy == oldObject.spec.?updateStrategy &&
        object.spec.?minReadySeconds == oldObject.spec.?minReadySeconds &&
        object.spec.?revisionHistoryLimit == oldObject.spec.?revisionHistoryLimit
      message: "Sentinel may not change a DaemonSet's rollout settings"
    - expression: "object.spec.template.metadata.?labels == oldObject.spec.template.metadata.?labels"
      message: "Sentinel may not change a DaemonSet's pod labels, which its selector rests on"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sentinel-fence-actor-daemonsets
  labels:
    {{- include "fence.labels" . | nindent 4 }}
spec:
  policyName: sentinel-fence-actor-daemonsets
  validationActions: [Deny]
