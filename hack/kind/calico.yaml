# Calico enforces NetworkPolicy, so this cluster exercises the path where the
# Lab may run. hack/kind-up.sh installs Calico after the cluster starts.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
  - role: worker
