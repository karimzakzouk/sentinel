# Flannel never enforces NetworkPolicy, on any kernel, so this cluster
# exercises the path where the Lab must refuse to run. hack/kind-up.sh
# installs Flannel after the cluster starts.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
  kubeProxyMode: nftables
nodes:
  - role: control-plane
  - role: worker
