version: "2"

run:
  timeout: 5m

linters:
  default: standard

  exclusions:
    paths:
      - internal/web/out
      - web
    rules:
      # CLI tools commonly ignore fmt.Fprint*/Sscanf/Close return values.
      - linters: [errcheck]
        path: cmd
        text: "Error return value of"
      # Test HTTP handlers commonly ignore w.Write return values.
      - linters: [errcheck]
        path: _test\.go
        text: "Error return value of"
      # resp.Body.Close() / rows.Close() / stream.Close() — defer Close()
      # return values are almost never meaningful (the body is already read).
      - linters: [errcheck]
        text: "Error return value of `.*\\.Body\\.Close`"
      - linters: [errcheck]
        text: "Error return value of `.*rows\\.Close`"
      - linters: [errcheck]
        text: "Error return value of `.*stream\\.Close`"
      - linters: [errcheck]
        text: "Error return value of `.*\\.Close`"
      # fmt.Fprintf to http.ResponseWriter — the write either succeeds or
      # the connection is broken; either way there's nothing to do.
      - linters: [errcheck]
        text: "Error return value of `fmt.Fprint"
