# golangci-lint v2 configuration for Sentinel
# v3.5.0: Migrated to v2 format, tuned exclusions for real-world Go patterns.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck       # catch ignored errors
    - govet          # go vet
    - ineffassign    # ineffectual assignments
    - staticcheck    # SA+ST+S+SC ranges (includes gosimple in v2)
    - unused         # unused vars, funcs, types, fields
    - misspell       # spelling errors in comments
    - revive         # golint successor — naming, exported docs
    - bodyclose      # http.Response.Body not closed
    # v3.5.0: disabled noisy linters — gocritic (style opinions), dupl
    # (duplicate code), goconst (string constants), nakedret (naked returns).
    # These are valid but too noisy for an established codebase.

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (io.Closer).Close
        - (*github.com/karimzakzouk/sentinel/v3/internal/feedback.Store).Close
    staticcheck:
      # v3.5.0: Disable QF (quickfix) + ST1003 (naming) + ST1020 (comment format).
      # QF = style suggestions, ST1003 = would require renaming exported struct fields
      # (breaks JSON), ST1020 = comment format pedantry.
      checks: ["all", "-QF*", "-ST1003", "-ST1020"]
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    paths:
      - "_test\\.go"
    rules:
      - path: "_test\\.go"
        linters:
          - dupl
          - errcheck
          - gocritic
      # Common deferred cleanup patterns — errcheck exclusions
      - path: ".*\\.go"
        linters:
          - errcheck
        source: "defer .+\\.Close\\(\\)"
      - path: ".*\\.go"
        linters:
          - errcheck
        source: "\\.Body\\.Close\\(\\)"
      - path: ".*\\.go"
        linters:
          - errcheck
        source: "rows\\.Close\\(\\)"
      - path: ".*\\.go"
        linters:
          - errcheck
        source: "w\\.Write\\("

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
