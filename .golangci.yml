version: "2"

run:
  timeout: 5m

linters:
  default: standard

  settings:
    staticcheck:
      # Disable quick-fix checks (QF*) — they're style suggestions, not bugs.
      # Keep SA* (static analysis) and ST* (style) checks.
      checks:
        - all
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1004
        - -QF1005
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1009
        - -QF1010
        - -QF1011
        - -QF1012

  exclusions:
    paths:
      - internal/web/out
      - web
    rules:
      # CLI tools commonly ignore fmt.Fprint*/Sscanf/Close return values.
      - linters: [errcheck]
        path: cmd
        text: "Error return value of"
      # Test HTTP handlers commonly ignore w.Write return values.
      - linters: [errcheck]
        path: _test\.go
        text: "Error return value of"
      # resp.Body.Close() / rows.Close() / stream.Close() — defer Close()
      # return values are almost never meaningful (the body is already read).
      - linters: [errcheck]
        text: "Error return value of `.*\\.Body\\.Close`"
      - linters: [errcheck]
        text: "Error return value of `.*rows\\.Close`"
      - linters: [errcheck]
        text: "Error return value of `.*stream\\.Close`"
      - linters: [errcheck]
        text: "Error return value of `.*\\.Close`"
      # fmt.Fprintf to http.ResponseWriter — the write either succeeds or
      # the connection is broken; either way there's nothing to do.
      - linters: [errcheck]
        text: "Error return value of `fmt.Fprint"
      # w.Write to http.ResponseWriter — same as above.
      - linters: [errcheck]
        text: "Error return value of `w\\.Write`"
      # SA9003: empty branch — sometimes intentional for readability.
      - linters: [staticcheck]
        text: "SA9003"
      # SA1012: nil context — tests intentionally pass nil.
      - linters: [staticcheck]
        path: _test\.go
        text: "SA1012"
