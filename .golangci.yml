# golangci-lint v2 configuration for Sentinel
# v3.5.0: Migrated to v2 format, tuned exclusions for real-world Go patterns.

version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck       # catch ignored errors
    - govet          # go vet
    - ineffassign    # ineffectual assignments
    - staticcheck    # SA+ST+S+SC ranges (includes gosimple in v2)
    - unused         # unused vars, funcs, types, fields
    - misspell       # spelling errors in comments
    - revive         # golint successor — naming, exported docs
    - gocritic       # common pitfalls
    - bodyclose      # http.Response.Body not closed
    - dupl           # duplicate code blocks
    - nakedret       # naked return in long functions
    # v3.5.0: 'goconst' disabled — too noisy for string-heavy code like
    # error type names ("KeyError", "panic") which are intentionally inline.

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      # Exclude common patterns where ignoring the error is standard Go practice:
      #   - defer resp.Body.Close() — body is already consumed, error is irrelevant
      #   - w.Write() in HTTP handlers — can't do anything with the error anyway
      #   - rows.Close() in SQL — cleanup, error is non-actionable
      #   - fmt.Sscanf return count — we only care about err, not n
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (io.Closer).Close
        - (*github.com/karimzakzouk/sentinel/v3/internal/feedback.Store).Close
    dupl:
      threshold: 150
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # v3.5.0: 'style' tag disabled — too many subjective suggestions
      # (rangeValCopy, appendCombine, regexpSimplify, etc.) that are valid
      # but not worth the noise for an established codebase.
      disabled-checks:
        - rangeValCopy      # would require pointer-indexing refactors everywhere
        - appendCombine     # subjective style preference
        - regexpSimplify    # subjective regex style
        - unnamedResult     # subjective
        - importShadow      # we use short var names like 'url' intentionally
        - hugeParam         # would require pointer refactors
        - exitAfterDefer    # known pattern — we accept deferred Close won't run on Fatal
        - httpNoBody        # nil works fine
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    paths:
      - "_test\\.go"
    rules:
      - path: "_test\\.go"
        linters:
          - dupl
          - errcheck
          - gocritic
      # Common deferred cleanup patterns — errcheck exclusions
      - path: ".*\\.go"
        linters:
          - errcheck
        source: "defer .+\\.Close\\(\\)"
      - path: ".*\\.go"
        linters:
          - errcheck
        source: "\\.Body\\.Close\\(\\)"
      - path: ".*\\.go"
        linters:
          - errcheck
        source: "rows\\.Close\\(\\)"
      - path: ".*\\.go"
        linters:
          - errcheck
        source: "w\\.Write\\("

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
