# One release: CRDs + Sentinel + fence (see charts/sentinel Chart.yaml).
profile: full
fence:
  enabled: true
watch:
  namespaces: [e2e-smoke, boutique, e2e-gitops, e2e-delivery]
global:
  watchNamespaces: [e2e-smoke, boutique, e2e-gitops, e2e-delivery]
  labPoolSize: 1
actor:
  enabled: true
lab:
  enabled: true
  poolSize: 1
  # The tests drive the Lab themselves; the controller's own experiments
  # would share its one namespace with them.
  verifyRollbacks: false
logLevel: debug
capabilities:
  interval: 1m
# Short windows make episodes end soon after a scenario is reverted.
detection:
  window: 1m
  tick: 5s
  incidentGap: 1m
  warmUp: 3m
# Two samples in every window.
logs:
  sampleInterval: 30s
sentinel-fence:
  namespaces: [e2e-smoke, boutique, e2e-gitops, e2e-delivery]
  replicas:
    min: 1
    max: 5
  lab:
    pool: [sentinel-lab-0]
    poolSize: 1
