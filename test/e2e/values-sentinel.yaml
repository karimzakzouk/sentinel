watch:
  namespaces: [e2e-smoke, boutique, e2e-gitops]
actor:
  enabled: true
lab:
  enabled: true
  poolSize: 1
logLevel: debug
capabilities:
  interval: 1m
# Short windows make episodes end soon after a scenario is reverted.
detection:
  window: 1m
  tick: 5s
  incidentGap: 1m
  warmUp: 3m
# Two samples in every window.
logs:
  sampleInterval: 30s
