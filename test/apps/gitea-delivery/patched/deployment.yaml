apiVersion: apps/v1
kind: Deployment
metadata:
  name: patched
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patched
  template:
    metadata:
      labels:
        app: patched
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: patched
          image: registry.k8s.io/e2e-test-images/agnhost:2.61
          args: [netexec, "--http-port=$(PORT)"]
          env:
            # Port 80 needs privileges this container does not have: the
            # patch in kustomization.yaml sets the port it runs on.
            - name: PORT
              value: "80"
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
