apiVersion: v1
kind: Namespace
metadata:
  name: e2e-smoke
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: boutique
---
# Workloads a GitOps controller deploys from public examples, which run as
# root: the baseline standard admits them.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-gitops
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
# The GitOps acting session's workloads, which Argo CD and Flux deliver
# (test/apps/delivery.yaml); some run as root, as in e2e-gitops.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-delivery
  labels:
    pod-security.kubernetes.io/enforce: baseline
