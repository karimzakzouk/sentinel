# pyshop deployed by Flux from the pyshop/ directory of the test Gitea's
# person/delivery into e2e-delivery, as git-pyshop: the workload the release
# scenarios in test/scenarios/git break with a commit to its source,
# person/pyshop-src. hack/shop-up.sh pyshop applies this.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: git-pyshop
  namespace: flux-system
spec:
  sourceRef: {kind: GitRepository, name: git-delivery}
  path: ./pyshop
  targetNamespace: e2e-delivery
  namePrefix: git-
  prune: true
  interval: 1m
