# bugapp deployed by Flux from the test Gitea's repository person/bugapp into
# e2e-delivery, as bugapp-bugapp: the workload the env-* scenarios in
# test/scenarios/git break by committing a bad environment value there.
# hack/bugapp-up.sh applies this.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: git-bugapp
  namespace: flux-system
spec:
  url: http://gitea-http.gitea.svc:3000/person/bugapp.git
  interval: 1m
  ref: {branch: main}
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bugapp
  namespace: flux-system
spec:
  sourceRef: {kind: GitRepository, name: git-bugapp}
  path: ./
  targetNamespace: e2e-delivery
  namePrefix: bugapp-
  prune: true
  interval: 1m
