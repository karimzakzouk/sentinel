id: delivery-flux-kustomization-bad-image
title: Flux rolls podinfo onto an image tag that does not exist, through its Kustomization's image override
app: delivery
fault:
  kind: patch
  target: {apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, namespace: flux-system, name: delivery-podinfo}
  patch:
    type: merge
    content: '{"spec":{"images":[{"name":"ghcr.io/stefanprodan/podinfo","newTag":"0.0.0-does-not-exist"}]}}'
groundTruth:
  faultClass: deploy.bad-image
  rootCause: {apiVersion: apps/v1, kind: Deployment, namespace: e2e-delivery, name: podinfo}
  changeType: image
  symptoms: [pod.image-pull-error]
  mitigation: rollout.undo
manifest:
  condition: image-pull-error
  namespace: e2e-delivery
  selector: app=podinfo
  timeout: 4m
