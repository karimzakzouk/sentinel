id: git-crash-on-start
title: A commit passes podinfo a flag it does not know, so it exits as it starts, and Flux deploys it
app: git
fault:
  kind: commit
  target: {apiVersion: kustomize.toolkit.fluxcd.io/v1, kind: Kustomization, namespace: flux-system, name: git-podinfo}
  commit:
    repository: person/delivery
    path: deployment.yaml
    # The image starts podinfo with CMD, so args alone would replace the
    # command, and the container could not start: a configuration error.
    old: "          ports:\n"
    new: "          command: [./podinfo, --no-such-flag]\n          ports:\n"
    message: Turn on the new flag
groundTruth:
  faultClass: deploy.crash-on-start
  rootCause: {apiVersion: apps/v1, kind: Deployment, namespace: e2e-delivery, name: git-podinfo}
  changeType: config
  symptoms: [pod.crash-loop]
  mitigation: rollout.undo
  # The right fix removes the line the commit added.
  fix: {path: deployment.yaml, line: 18}
manifest:
  condition: crash-loop
  namespace: e2e-delivery
  selector: app=podinfo
  timeout: 4m
