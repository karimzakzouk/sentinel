id: smoke-crash-on-start
title: A deploy passes the web server a flag it does not understand, so it exits at start
app: smoke
fault:
  kind: patch
  target: {apiVersion: apps/v1, kind: Deployment, namespace: e2e-smoke, name: web}
  patch:
    type: strategic
    content: '{"spec":{"template":{"spec":{"containers":[{"name":"web","args":["netexec","--http-port=8080","--no-such-flag"]}]}}}}'
groundTruth:
  faultClass: deploy.crash-on-start
  rootCause: {apiVersion: apps/v1, kind: Deployment, namespace: e2e-smoke, name: web}
  changeType: config
  symptoms: [pod.crash-loop]
  mitigation: rollout.undo
manifest:
  condition: crash-loop
  namespace: e2e-smoke
  selector: app=web
  timeout: 4m
