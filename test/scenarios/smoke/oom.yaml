id: smoke-oom
title: A config change sets the web container's memory limit below what it needs
app: smoke
fault:
  kind: patch
  target: {apiVersion: apps/v1, kind: Deployment, namespace: e2e-smoke, name: web}
  patch:
    type: strategic
    content: '{"spec":{"template":{"spec":{"containers":[{"name":"web","resources":{"requests":{"memory":"6Mi"},"limits":{"memory":"6Mi"}}}]}}}}'
groundTruth:
  faultClass: resource.memory-limit
  rootCause: {apiVersion: apps/v1, kind: Deployment, namespace: e2e-smoke, name: web}
  changeType: resources
  symptoms: [pod.oom-killed, pod.crash-loop]
  mitigation: rollout.undo
manifest:
  condition: oom-killed
  namespace: e2e-smoke
  selector: app=web
  timeout: 3m
