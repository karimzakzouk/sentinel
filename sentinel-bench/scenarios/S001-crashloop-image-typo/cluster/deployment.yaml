apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sample-app
  template:
    metadata:
      labels:
        app: sample-app
    spec:
      containers:
        # BUG: image tag is "v1.2.3" but the actual published tag is "v1.23".
        # The typo causes ImagePullBackOff -> CrashLoopBackOff.
        - name: app
          image: ghcr.io/sentinel-bench/sample-python-app:v1.2.3
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
