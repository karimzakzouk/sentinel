id: S003
slug: go-nil-pointer-panic
title: "Go service panics on nil config pointer at startup"
category: crashloop
severity: sev2
difficulty: moderate
origin: synthetic

time_budget: 15m
token_budget: 200000
cost_budget_usd: 2.00

setup:
  cluster:
    kind_version: v0.24.0
    kubernetes_version: v1.30.0
    nodes: 3
  apply:
    - cluster/deployment.yaml
    - cluster/service.yaml
    - cluster/configmap.yaml
  source_repo: "https://github.com/sentinel-bench/sample-go-service"
  source_ref: "main"
  source_path: "main.go"

trigger:
  type: alertmanager
  alert:
    alertname: KubePodCrashLooping
    namespace: prod
    pod: inventory-api-xxxxx-yyyyy
    container: app
    restarts: 11
    labels:
      severity: critical
      service: inventory-api
    annotations:
      summary: "Pod inventory-api in prod is crash-looping"
      description: "Pod inventory-api-xxxxx-yyyyy in namespace prod has restarted 11 times in the last 5 minutes. Container logs show a Go panic stack trace."

# Sample log line the investigator will see when it polls the cluster:
#   2025-01-14T03:21:09Z INF starting inventory-api version=v1.2.0
#   panic: runtime error: invalid memory address or nil pointer dereference
#   [signal SIGSEGV: segmentation violation code=0x1 addr=0x8 pc=0x6f4d2a]
#
#   goroutine 1 [running]:
#   main.main()
#           /workspace/main.go:48 +0x2a
#
# The Deployment ships a ConfigMap that intentionally omits the `server:`
# section. main.go reads `cfg.Server.Port` without checking `cfg.Server ==
# nil`, so the dereference panics on startup. The fix is to add a nil
# check (and a helpful error message) in main.go.

assertions:
  - type: pr_opened
    weight: 0.25
  - type: pr_ci_green
    weight: 0.25
  - type: diff_similarity
    threshold: 0.80
    weight: 0.25
  - type: sentinel_automerge_approved
    weight: 0.25

ground_truth: ground-truth.diff
evidence: evidence.md
