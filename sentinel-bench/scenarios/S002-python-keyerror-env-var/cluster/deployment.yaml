apiVersion: v1
kind: Namespace
metadata:
  name: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      containers:
        # BUG: the env var is named `DATABASE_URLL` (double-L) but the Flask
        # app reads `os.environ['DATABASE_URL']` (single-L). The app crashes
        # on import with `KeyError: 'DATABASE_URL'`, the pod enters
        # CrashLoopBackOff within ~10 seconds of being scheduled.
        - name: app
          image: ghcr.io/sentinel-bench/payments-api:v1.4.2
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URLL
              value: "postgres://payments:****@db.prod.svc.cluster.local:5432/payments"
            - name: FLASK_ENV
              value: "production"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
